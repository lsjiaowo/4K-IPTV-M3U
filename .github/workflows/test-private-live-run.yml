name: Test Private Live Run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-private-live-run.yml"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one private telecom health run
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IPTV_GIST_ID: ${{ secrets.IPTV_GIST_ID }}
          IPTV_GIST_PREFIX: ${{ secrets.IPTV_GIST_PREFIX }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["PRIVATE_REPO_TOKEN"].strip()
          body = json.dumps({
              "event_type": "iptv_private_run",
              "client_payload": {
                  "carrier": "telecom",
                  "label": "电信",
                  "mode": "health",
                  "source_event": "schedule",
                  "inputs": {},
                  "gist_token": os.environ["GIST_TOKEN"].strip(),
                  "gist_id": os.environ["IPTV_GIST_ID"].strip(),
                  "gist_prefix": os.environ.get("IPTV_GIST_PREFIX", ""),
                  "private_repo_token": token,
              },
          }, ensure_ascii=False).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY_OWNER']}/4K-IPTV-Core/dispatches",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit(f"dispatch failed: HTTP {response.status}")
          print("[+] Private live-run test dispatched.")
          PY
