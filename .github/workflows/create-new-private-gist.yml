name: Create New Private IPTV Gist

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-new-private-gist.yml"

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private core
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-core
          fetch-depth: 1

      - name: Create new secret Gist from current playlists
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          root = Path(".private-core/private_workspace/m3u")
          files = {}
          for path in sorted(root.glob("*.m3u")):
              files[path.name] = {"content": path.read_text(encoding="utf-8")}

          if not files:
              raise SystemExit("No M3U files found")

          payload = {
              "description": "Private IPTV playlists",
              "public": False,
              "files": files,
          }
          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              "https://api.github.com/gists",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GIST_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "4K-IPTV-Core-Gist-Migrator",
              },
          )
          with urllib.request.urlopen(req, timeout=120) as response:
              data = json.load(response)

          gist_id = data["id"]
          out = Path(".private-core/private_workspace/.github/new-gist.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              "gist_id": gist_id,
              "file_count": len(files),
              "filename_prefix": "",
              "example": f"https://gist.githubusercontent.com/lsjiaowo/{gist_id}/raw/天津联通.m3u",
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(f"[+] New secret Gist created with {len(files)} M3U files.")
          print("[+] New Gist ID saved only in private core.")
          PY

      - name: Save new Gist ID privately
        shell: bash
        run: |
          set -euo pipefail
          cd .private-core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add private_workspace/.github/new-gist.json
          git commit -m "Store newly generated private Gist ID"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "[+] New Gist metadata saved privately."
