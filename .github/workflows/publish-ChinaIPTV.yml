name: Publish China IPTV Gist Subscription

# Updating this file or using Run workflow republishes only the aggregate M3U.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ChinaIPTV.yml

concurrency:
  group: iptv-china-m3u-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private IPTV core
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-core
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and publish China IPTV only
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import quote

          root = Path(".private-core").resolve()
          sys.path.insert(0, str(root))
          from build_china_iptv import SOURCE_RE, build_china_iptv_playlist

          publication = json.loads(
              (root / "private_workspace/.github/iptv-publication.json").read_text(encoding="utf-8")
          )
          gist_id = str(publication["gist_id"]).strip()
          prefix = str(publication.get("prefix", "")).strip()
          if prefix:
              raise SystemExit("当前 Gist 配置存在前缀；请先确认固定订阅路径，不自动变更发布命名空间")
          token = os.environ.get("GIST_TOKEN", "")
          if not token:
              raise SystemExit("GIST_TOKEN is not configured")

          out, count, channels = build_china_iptv_playlist(root / "private_workspace/m3u")
          contents = out.read_text(encoding="utf-8")
          expected = contents.encode("utf-8")
          if not contents.startswith("#EXTM3U") or channels < 1:
              raise SystemExit("Invalid/empty M3U; refusing to publish")
          # Every provincial playlist (including numbered slots) must have its own group.
          expected_groups = {
              p.stem for p in (root / "private_workspace/m3u").glob("*.m3u")
              if SOURCE_RE.fullmatch(p.name)
          }
          actual_groups = re.findall(
              r'^#EXTINF:[^\n]*?\bgroup-title="([^"]+)"',
              contents, flags=re.MULTILINE,
          )
          if (len(expected_groups) != count
                  or len(actual_groups) != channels
                  or set(actual_groups) != expected_groups):
              missing_groups = sorted(expected_groups - set(actual_groups))
              extra_groups = sorted(set(actual_groups) - expected_groups)
              raise SystemExit(
                  f"M3U groups mismatch: expected={count}, observed={len(set(actual_groups))}, "
                  f"missing={missing_groups}, unexpected={extra_groups}"
              )
          print(f"[+] Verified {len(expected_groups)} independent source groups "
                f"(including numbered slots); {channels} channel entries")

          name = "中国IPTV.m3u"
          api = f"https://api.github.com/gists/{gist_id}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "User-Agent": "4K-IPTV-M3U-China-Publisher",
          }
          data = json.dumps({"files": {name: {"content": contents}}}, ensure_ascii=False).encode("utf-8")
          request = urllib.request.Request(api, headers=headers, data=data, method="PATCH")
          with urllib.request.urlopen(request, timeout=180) as response:
              updated = json.load(response)
          if name not in updated.get("files", {}):
              raise SystemExit("Gist PATCH returned successfully but the file was not present")

          raw_url = "https://gist.githubusercontent.com/lsjiaowo/" + gist_id + "/raw/" + quote(name)
          # GitHub caches the versionless RAW URL after edits; verify the actual
          # new Gist revision first, then probe the stable subscription URL.
          revision_url = updated["files"][name].get("raw_url", raw_url)
          digest = hashlib.sha256(expected).digest()
          verified = False
          for attempt in range(8):
              candidates = (
                  revision_url,
                  raw_url + "?v=" + hashlib.sha256(expected).hexdigest()[:16] + f"-{attempt}",
              )
              for candidate_url in dict.fromkeys(candidates):
                  try:
                      raw_request = urllib.request.Request(
                          candidate_url,
                          headers={"Cache-Control": "no-cache", "User-Agent": "IPTV-M3U-Verification"},
                      )
                      with urllib.request.urlopen(raw_request, timeout=120) as response:
                          actual = response.read()
                      if hashlib.sha256(actual).digest() != digest:
                          print(f"[*] Gist CDN returned a stale version on attempt {attempt + 1}; retrying")
                          continue
                      verified = True
                      break
                  except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                      print(f"[*] RAW attempt {attempt + 1}/8 failed: {type(exc).__name__}")
              if verified:
                  break
              time.sleep(4)
          if not verified:
              raise SystemExit("Gist API updated, but the new M3U revision could not be verified")

          try:
              stable_request = urllib.request.Request(
                  raw_url,
                  headers={"Cache-Control": "no-cache", "User-Agent": "IPTV-M3U-Verification"},
              )
              with urllib.request.urlopen(stable_request, timeout=120) as response:
                  stable = response.read()
              stable_ready = hashlib.sha256(stable).digest() == digest
          except (urllib.error.HTTPError, urllib.error.URLError):
              stable_ready = False
          if not stable_ready:
              print("::warning::Fixed Gist RAW URL is temporarily cached; latest revision verified. "
                    "The versionless URL may take time to refresh.")

          print(f"[+] China IPTV RAW verified: {raw_url}")
          print(f"[+] Independent M3U groups: {len(expected_groups)}; "
                f"source playlists: {count}; channels: {channels}; "
                f"bytes: {len(actual)}; SHA256 verified; stable_url_fresh={stable_ready}")
          PY
      - name: Save updated unified M3U back to private core
        shell: bash
        run: |
          set -euo pipefail
          cd .private-core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "private_workspace/m3u/中国IPTV.m3u"
          if git diff --cached --quiet; then
            echo "[+] Private China IPTV M3U already matches published content."
            exit 0
          fi
          git commit -m "Keep China IPTV groups distinct for each M3U slot" >/dev/null

          for attempt in 1 2 3; do
            git fetch origin main >/dev/null
            if ! git rebase -X theirs origin/main >/dev/null 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "::error::Unable to merge China IPTV aggregate into private main."
              exit 1
            fi
            if git push origin HEAD:main >/dev/null 2>&1; then
              echo "[+] Updated China IPTV aggregate persisted to private main."
              exit 0
            fi
            echo "::warning::Private main changed; retrying the aggregate push ($attempt/3)."
            sleep 2
          done
          echo "::error::Failed to persist grouped aggregate to private main."
          exit 1

