name: One-time health maintenance - Telecom then Unicom

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-health-all.yml"

concurrency:
  group: iptv-source-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telecom:
    name: One-time all existing Telecom health
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Configure Git identity
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Health check all existing Telecom playlists
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IPTV_GIST_ID: ${{ secrets.IPTV_GIST_ID }}
        run: |
          echo "[*] 本次一次性任务：检查仓库当前已经存在的全部电信标准槽位。"
          echo "[*] 健康则保持原文件和原更新时间；失效才修复；缺失槽位不补齐、不创建。"
          python -u rtp/b.py \
            --health-check \
            --health-provinces "全部" \
            --health-carriers "电信" \
            --health-file-mode check \
            --max-pages 10 \
            --max-per-carrier 20 \
            --push

  unicom:
    name: One-time all existing Unicom health
    needs: telecom
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout latest main after Telecom
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest main after Telecom
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Configure Git identity
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Health check all existing Unicom playlists
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IPTV_GIST_ID: ${{ secrets.IPTV_GIST_ID }}
        run: |
          echo "[*] 电信任务已成功完成，现在开始检查仓库当前已经存在的全部联通标准槽位。"
          echo "[*] 健康则保持原文件和原更新时间；失效才修复；缺失槽位不补齐、不创建。"
          python -u rtp/b.py \
            --health-check \
            --health-provinces "全部" \
            --health-carriers "联通" \
            --health-file-mode check \
            --max-pages 10 \
            --max-per-carrier 20 \
            --min-stream-speed 0.5859375 \
            --push

  cleanup:
    name: Remove one-time workflow
    needs:
      - telecom
      - unicom
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Remove temporary workflow
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-time-health-all.yml
          git commit -m "chore: remove one-time IPTV health workflow"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 3))
          done
          exit 1
