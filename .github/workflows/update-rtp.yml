name: Update RTP Sources

on:
  workflow_dispatch:
    inputs:
      province:
        description: "选择要更新的省份"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "浙江"
          - "安徽"
          - "福建"
          - "湖南"
          - "广东"
          - "四川"
          - "山西"
          - "湖北"
  schedule:
    # 每小时第18分钟触发；定时运行始终更新全部省份。
    - cron: "18 * * * *"

concurrency:
  group: update-rtp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug workspace
        run: |
          pwd
          ls -la
          ls -la "${{ github.workspace }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ github.workspace }}/requirements.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements.txt"
          else
            echo "requirements.txt not found, fallback to direct install."
            pip install "requests>=2.31.0"
          fi

      - name: Run updater
        env:
          PYTHONUNBUFFERED: "1"
          SELECTED_PROVINCE: "${{ github.event.inputs.province }}"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ -n "$SELECTED_PROVINCE" ] &&
             [ "$SELECTED_PROVINCE" != "全部" ]; then
            echo "[*] 手动运行：仅更新 $SELECTED_PROVINCE"
            python -u rtp/b.py \
              --only-province "$SELECTED_PROVINCE" \
              --max-pages 5 \
              --max-per-carrier 2
          else
            echo "[*] 定时运行或手动选择全部：更新所有省份"
            python -u rtp/b.py \
              --max-pages 5 \
              --max-per-carrier 2
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase onto latest remote safely (generated files may exist).
          git stash push -u -m "generated outputs" || true
          git pull --rebase origin main || true
          git stash pop || true

          # Stage additions/modifications/deletions under outputs + README.
          git add -A -- txt m3u README.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update rtp sources"
            git push
          fi
