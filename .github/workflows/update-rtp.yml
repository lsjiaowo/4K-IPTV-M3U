name: Update RTP Sources

on:
  schedule:
    # 设定每小时的第 5 分钟触发一次，直接避开 00 分整点
    - cron: '5 * * * *'
  workflow_dispatch: # 保留手动触发按钮

concurrency:
  group: update-rtp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug workspace
        run: |
          pwd
          ls -la
          ls -la "${{ github.workspace }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ github.workspace }}/requirements.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements.txt"
          else
            echo "requirements.txt not found, fallback to direct install."
            pip install "requests>=2.31.0"
          fi

      - name: Run original updater
        run: python rtp/b.py --push --max-age-hours 72

      # =================新增步骤=================
      # 执行抓取新网站的脚本（假设文件放在根目录）
      - name: Run new IPTV updater
        run: python b_iptv.cqshushu.com.py --push --max-age-hours 72
      # ==========================================

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase onto latest remote safely (generated files may exist).
          git stash push -u -m "generated outputs" || true
          git pull --rebase origin main || true
          git stash pop || true
          
          # =================修改步骤=================
          # 新增追踪：txt_iptv、m3u_iptv 目录以及 README_IPTV.md 文件
          git add -A -- txt m3u txt_iptv m3u_iptv README.md README_IPTV.md || true
          # ==========================================
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update rtp sources"
            git push
          fi
