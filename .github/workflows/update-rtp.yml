name: Update RTP Sources

on:
  workflow_dispatch:
    inputs:
      province:
        description: "选择要更新的省份"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "浙江"
          - "安徽"
          - "福建"
          - "湖南"
          - "广东"
          - "四川"
          - "山西"
          - "湖北"
  schedule:
    # 每小时提供4个候选触发点；小时锁确保实际最多更新一次。
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: update-rtp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build hourly lock key
        id: hourly-slot
        shell: bash
        run: |
          echo "cache_key=update-rtp-hour-$(date -u +'%Y%m%d%H')" >> "$GITHUB_OUTPUT"

      - name: Check whether this hour has already run
        id: hourly-cache
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .github-hourly-run
          key: ${{ steps.hourly-slot.outputs.cache_key }}
          lookup-only: true

      - name: Explain skipped duplicate
        if: github.event_name == 'schedule' && steps.hourly-cache.outputs.cache-hit == 'true'
        run: echo "[*] 本小时已经成功更新过，跳过本次候选触发。"

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug workspace
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          pwd
          ls -la
          ls -la "${{ github.workspace }}"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ github.workspace }}/requirements.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements.txt"
          else
            echo "requirements.txt not found, fallback to direct install."
            pip install "requests>=2.31.0"
          fi

      - name: Run updater
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          SELECTED_PROVINCE: "${{ github.event.inputs.province }}"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ -n "$SELECTED_PROVINCE" ] &&
             [ "$SELECTED_PROVINCE" != "全部" ]; then
            echo "[*] 手动运行：仅更新 $SELECTED_PROVINCE"
            python -u rtp/b.py \
              --only-province "$SELECTED_PROVINCE" \
              --max-pages 5 \
              --max-per-carrier 2
          else
            echo "[*] 定时运行或手动选择全部：更新所有省份"
            python -u rtp/b.py \
              --max-pages 5 \
              --max-per-carrier 2
          fi

      - name: Commit and push if changed
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase onto latest remote safely (generated files may exist).
          git stash push -u -m "generated outputs" || true
          git pull --rebase origin main || true
          git stash pop || true

          # Stage additions/modifications/deletions under outputs + README.
          git add -A -- txt m3u README.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update rtp sources"
            git push
          fi

      - name: Create successful hourly marker
        if: success() && github.event_name == 'schedule' && steps.hourly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .github-hourly-run
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github-hourly-run/completed-at.txt

      - name: Save successful hourly marker
        if: success() && github.event_name == 'schedule' && steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .github-hourly-run
          key: ${{ steps.hourly-slot.outputs.cache_key }}
