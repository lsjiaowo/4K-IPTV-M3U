name: Update CQShuShu IPTV Sources

on:
  workflow_dispatch:
  schedule:
    # UTC 01:20 and 13:20; offset from the legacy RTP workflow.
    - cron: "20 1,13 * * *"

concurrency:
  group: update-cqshushu-iptv-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.31.0"

      - name: Fetch CQShuShu playlists
        env:
          # Add a repository secret named CQS_COOKIE after completing normal
          # browser verification on iptv.cqshushu.com.  Do not print this value.
          CQS_COOKIE: ${{ secrets.CQS_COOKIE }}
        run: python rtp/b_iptv.cqshushu.com.py --province sc --limit 10

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- cqshushu_txt cqshushu_m3u
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update CQShuShu IPTV sources"
            git push
          fi
