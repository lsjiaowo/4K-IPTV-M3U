          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_3:
        description: "省份3（可选）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      carriers:
        description: "选择运营商组合"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "电信"
          - "联通"
          - "移动"
          - "电信,联通"
          - "电信,移动"
          - "联通,移动"
  schedule:
    # 每小时提供4个候选触发点；小时锁确保实际最多更新一次。
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: update-rtp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 定时抓取目标：直接在此处增加或删除“省份+运营商”。
      AUTO_TARGETS: "四川电信,浙江电信,福建电信,山西电信,湖北电信,湖南电信"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build hourly lock key
        id: hourly-slot
        shell: bash
        run: |
          echo "cache_key=update-rtp-hour-$(date -u +'%Y%m%d%H')" >> "$GITHUB_OUTPUT"

      - name: Check whether this hour has already run
        id: hourly-cache
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .github-hourly-run
          key: ${{ steps.hourly-slot.outputs.cache_key }}
          lookup-only: true

      - name: Explain skipped duplicate
        if: github.event_name == 'schedule' && steps.hourly-cache.outputs.cache-hit == 'true'
        run: echo "[*] 本小时已经成功更新过，跳过本次候选触发。"

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug workspace
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          pwd
          ls -la
          ls -la "${{ github.workspace }}"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ github.workspace }}/requirements.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements.txt"
          else
            echo "requirements.txt not found, fallback to direct install."
            pip install "requests>=2.31.0"
          fi

      - name: Run updater
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          PROVINCE_1: "${{ github.event.inputs.province_1 }}"
          PROVINCE_2: "${{ github.event.inputs.province_2 }}"
          PROVINCE_3: "${{ github.event.inputs.province_3 }}"
          SELECTED_CARRIERS: "${{ github.event.inputs.carriers }}"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$PROVINCE_1" = "全部" ]; then
              SELECTED_PROVINCES="全部"
            else
              SELECTED_PROVINCES="$PROVINCE_1"
              if [ -n "$PROVINCE_2" ] && [ "$PROVINCE_2" != "不选择" ]; then
                SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_2"
              fi
              if [ -n "$PROVINCE_3" ] && [ "$PROVINCE_3" != "不选择" ]; then
                SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_3"
              fi
            fi
            echo "[*] 手动运行：省份=$SELECTED_PROVINCES；运营商=$SELECTED_CARRIERS"
            python -u rtp/b.py \
              --provinces "$SELECTED_PROVINCES" \
              --carriers "$SELECTED_CARRIERS" \
              --max-pages 5 \
              --max-per-carrier 2
          else
            echo "[*] 定时运行：目标=$AUTO_TARGETS"
            python -u rtp/b.py \
              --targets "$AUTO_TARGETS" \
              --max-pages 5 \
              --max-per-carrier 2
          fi

      - name: Commit and push if changed
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase onto latest remote safely (generated files may exist).
          git stash push -u -m "generated outputs" || true
          git pull --rebase origin main || true
          git stash pop || true

          # Stage additions/modifications/deletions under outputs + README.
          git add -A -- txt m3u README.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update rtp sources"
            git push
          fi

      - name: Create successful hourly marker
        if: success() && github.event_name == 'schedule' && steps.hourly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .github-hourly-run
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github-hourly-run/completed-at.txt

      - name: Save successful hourly marker
        if: success() && github.event_name == 'schedule' && steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .github-hourly-run
          key: ${{ steps.hourly-slot.outputs.cache_key }}
