name: Render Current Private Foldable Log

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-current-private-log.yml"

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private raw live logs
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: live-logs
          path: source
          fetch-depth: 0

      - name: Checkout private foldable view
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: live-view
          path: view
          fetch-depth: 0

      - name: Mirror current telecom log as foldable Markdown
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "37554052252"
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import subprocess
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          source = root / "source"
          view = root / "view"
          target_run = os.environ["TARGET_RUN_ID"]
          carrier = "telecom"

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], cwd=view, check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              cwd=view,
              check=True,
          )

          def quiet_git(repo, *args):
              return subprocess.run(
                  ["git", *args],
                  cwd=repo,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )

          def render(text, status):
              preamble = []
              groups = []
              title = None
              body = []

              for line in text.splitlines():
                  if line.startswith("::group::"):
                      if title is not None:
                          groups.append((title, body, False))
                      title = line[len("::group::"):].strip()
                      body = []
                  elif line.strip() == "::endgroup::":
                      if title is not None:
                          groups.append((title, body, True))
                          title = None
                          body = []
                  elif title is None:
                      preamble.append(line)
                  else:
                      body.append(line)

              if title is not None:
                  groups.append((title, body, False))

              out = [
                  "# 电信实时运行日志",
                  "",
                  f"> Run ID：\`{status.get('run_id','')}\`  ",
                  f"> 更新时间：\`{status.get('updated_at','')}\`  ",
                  "> 已完成省份默认折叠；当前正在运行的省份默认展开。",
                  "",
              ]

              if preamble:
                  out += ["## 任务概览", "", "<pre>", html.escape("\n".join(preamble)), "</pre>", ""]

              for group_title, lines, closed in groups:
                  out.append("<details>" if closed else "<details open>")
                  suffix = "" if closed else "（运行中）"
                  out.append(f"<summary><strong>{html.escape(group_title)}{suffix}</strong></summary>")
                  out += ["", "<pre>", html.escape("\n".join(lines)), "</pre>", "", "</details>", ""]

              if not groups:
                  out += ["_等待省份日志输出。_", ""]

              return "\n".join(out).rstrip() + "\n"

          def sync_view():
              quiet_git(source, "fetch", "origin", "live-logs")
              quiet_git(source, "reset", "--hard", "origin/live-logs")

              log_path = source / "private_logs" / "live" / f"{carrier}.log"
              status_path = source / "private_logs" / "live" / f"{carrier}.json"
              if not log_path.exists() or not status_path.exists():
                  return False

              status = json.loads(status_path.read_text(encoding="utf-8"))
              if str(status.get("run_id")) != target_run:
                  return False

              out_dir = view / "private_logs" / "live"
              out_dir.mkdir(parents=True, exist_ok=True)
              md = out_dir / f"{carrier}.md"
              status_copy = out_dir / f"{carrier}.json"

              md.write_text(
                  render(log_path.read_text(encoding="utf-8", errors="replace"), status),
                  encoding="utf-8",
              )
              status_copy.write_text(
                  json.dumps(status, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

              quiet_git(view, "add", str(md.relative_to(view)), str(status_copy.relative_to(view)))
              if quiet_git(view, "diff", "--cached", "--quiet").returncode == 0:
                  return True
              if quiet_git(view, "commit", "--amend", "--no-edit").returncode != 0:
                  return False
              return quiet_git(view, "push", "--force", "origin", "HEAD:live-view").returncode == 0

          def run_status():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/lsjiaowo/4K-IPTV-M3U/actions/runs/{target_run}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "private-live-view-renderer",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp).get("status", "")

          print("[*] Private foldable live view renderer started.")
          while True:
              sync_view()
              try:
                  status = run_status()
              except Exception:
                  status = "in_progress"

              if status == "completed":
                  time.sleep(15)
                  sync_view()
                  print("[+] Current private foldable live view finalized.")
                  break

              time.sleep(30)
          PY
