name: Validate Private Persistence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-private-persistence.yml"

concurrency:
  group: iptv-public-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private main
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: core
          fetch-depth: 0

      - name: Checkout private live-view
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: live-view
          path: view
          fetch-depth: 0

      - name: Validate live-view update path
        shell: bash
        run: |
          set -euo pipefail
          cd view
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p private_logs/live
          TEST="private_logs/live/.validation-${GITHUB_RUN_ID}.txt"
          echo "validation" > "$TEST"
          git add "$TEST"
          git commit --amend --no-edit >/dev/null
          git push --force origin HEAD:live-view >/dev/null
          rm "$TEST"
          git add -u
          git commit --amend --no-edit >/dev/null
          git push --force origin HEAD:live-view >/dev/null
          echo "[+] Private live-view write path validated."

      - name: Validate private main persistence path
        shell: bash
        run: |
          set -euo pipefail
          cd core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TEST="private_logs/archive/.validation-${GITHUB_RUN_ID}.txt"
          mkdir -p private_logs/archive
          echo "validation" > "$TEST"
          git add "$TEST"
          git commit -m "Validate private persistence ${GITHUB_RUN_ID}" >/dev/null
          git fetch origin main >/dev/null 2>&1
          REMOTE_SHA="$(git rev-parse origin/main)"
          PARENT_SHA="$(git rev-parse HEAD^)"
          if [ "$REMOTE_SHA" != "$PARENT_SHA" ]; then
            git reset --hard HEAD >/dev/null
            git clean -fd >/dev/null
            git rebase -X theirs origin/main >/dev/null 2>&1
          fi
          git push origin HEAD:main >/dev/null

          rm "$TEST"
          git add -u
          git commit -m "Remove private persistence validation ${GITHUB_RUN_ID}" >/dev/null
          git push origin HEAD:main >/dev/null
          echo "[+] Private main persistence path validated."
