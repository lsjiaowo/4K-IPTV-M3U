name: Migrate myTV Base64 Cloud Config

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-mytv-base64-config.yml"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate encoded myTV cloud data
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          gist_id = "9c739f61eb0bafa7b59e935a99523183"
          old_id = "151462a1b2deeb3816e2f4ce3b3b44b1"
          new_id = "de49ae260221e2d7088193d8f67a3769"

          headers = {
              "Authorization": f"Bearer {os.environ['GIST_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "mytv-base64-cloud-migrator",
          }

          def api(url, method="GET", payload=None):
              body = None if payload is None else json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as resp:
                  raw = resp.read()
                  return json.loads(raw.decode("utf-8")) if raw else {}

          data = api(f"https://api.github.com/gists/{gist_id}")
          f = (data.get("files") or {}).get("all_configs.json")
          if not f:
              raise SystemExit("all_configs.json missing")

          encoded = (f.get("content") or "").strip()
          decoded = base64.b64decode(encoded).decode("utf-8")
          parsed = json.loads(decoded)

          old_count = decoded.count(old_id)
          prefix_count = decoded.count("live_20261005_")
          new_before = decoded.count(new_id)
          print(f"[i] decoded_size={len(decoded)}")
          print(f"[i] old_id_refs={old_count}")
          print(f"[i] old_prefix_refs={prefix_count}")
          print(f"[i] new_id_refs_before={new_before}")

          updated = decoded.replace(old_id, new_id)
          updated = updated.replace("/raw/live_20261005_", "/raw/")

          # Ensure the transformed payload is still valid CloudSync JSON.
          json.loads(updated)

          new_encoded = base64.b64encode(updated.encode("utf-8")).decode("ascii")
          api(
              f"https://api.github.com/gists/{gist_id}",
              "PATCH",
              {"files": {"all_configs.json": {"content": new_encoded}}},
          )

          verify = api(f"https://api.github.com/gists/{gist_id}")
          vf = (verify.get("files") or {}).get("all_configs.json")
          final = base64.b64decode((vf.get("content") or "").strip()).decode("utf-8")
          json.loads(final)

          remaining_old = final.count(old_id)
          remaining_prefix = final.count("live_20261005_")
          new_after = final.count(new_id)
          print(f"[+] remaining_old_id_refs={remaining_old}")
          print(f"[+] remaining_old_prefix_refs={remaining_prefix}")
          print(f"[+] new_id_refs_after={new_after}")

          if remaining_old or remaining_prefix:
              raise SystemExit("Old playlist references remain after migration")
          if old_count and new_after < old_count:
              raise SystemExit("Not all old playlist references migrated")
          PY
