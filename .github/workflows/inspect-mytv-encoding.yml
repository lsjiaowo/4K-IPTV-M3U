name: Inspect myTV Cloud Encoding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-mytv-encoding.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cloud file encoding
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PY'
          import base64, gzip, json, os, urllib.request, zlib

          gist_id = "9c739f61eb0bafa7b59e935a99523183"
          headers = {
              "Authorization": f"Bearer {os.environ['GIST_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          req = urllib.request.Request(f"https://api.github.com/gists/{gist_id}", headers=headers)
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)

          f = (data.get("files") or {}).get("all_configs.json")
          content = (f or {}).get("content") or ""
          print(f"len={len(content)}")
          print(f"startswith_brace={content.lstrip().startswith('{')}")
          print(f"startswith_bracket={content.lstrip().startswith('[')}")
          print(f"ascii_prefix_hex={content[:48].encode('utf-8',errors='replace').hex()}")
          stripped = "".join(content.split())
          print(f"base64_charset={all(c.isalnum() or c in '+/=_-' for c in stripped[:500])}")
          try:
              raw = base64.b64decode(stripped, validate=False)
              print(f"base64_decoded_len={len(raw)}")
              print(f"base64_magic_hex={raw[:16].hex()}")
              for name, fn in [("gzip", gzip.decompress), ("zlib", zlib.decompress)]:
                  try:
                      dec = fn(raw)
                      print(f"{name}_ok=true decoded_len={len(dec)} starts_json={dec.lstrip()[:1] in (b'{',b'[')}")
                  except Exception:
                      print(f"{name}_ok=false")
          except Exception as e:
              print(f"base64_decode=false:{type(e).__name__}")
          PY
