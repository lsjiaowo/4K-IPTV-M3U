  workflow_dispatch:
    inputs:
      province_1:
        description: "省份1（默认项与自动定时运行相同；选择后忽略其他选项）"
        required: true
        default: "定时默认10省电信"
        type: choice
        options:
          - "定时默认10省电信"
          - "全部"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_2:
        description: "省份2（可选）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_3:
        description: "省份3（可选）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      carriers:
        description: "选择运营商组合"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "电信"
          - "联通"
          - "移动"
          - "电信,联通"
          - "电信,移动"
          - "联通,移动"
  # 可选外部整点触发入口；电信工作流使用独立事件类型，避免两个工作流被同一个 dispatch 同时触发。
  repository_dispatch:
    types: [hourly_iptv_telecom_update]

  schedule:
    # 电信候选窗口放在每小时前半小时（01～26分）；小时锁保证本工作流每小时最多执行一次完整抓取。
    - cron: "1,6,11,16,21,26 * * * *"
# 两个运营商工作流共用固定并发组：任何时刻只允许一个电信/联通抓取任务真正运行；后到任务只排队、不取消。
concurrency:
  group: iptv-source-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 电信定时默认10省抓取目标：按下列顺序执行；可直接在此处增加、删除或调整“省份+运营商”。
      AUTO_TARGETS: "四川电信,浙江电信,湖北电信,安徽电信,山西电信,广东电信,湖南电信,河北电信,陕西电信,福建电信"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 明确在任务真正获得并发锁、开始执行时检出最新 main，避免排队期间 GITHUB_SHA 变旧。
          ref: main

      - name: Sync latest main after concurrency wait
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "[*] 已同步到任务实际开始时的最新 origin/main，避免并发排队导致旧基线。"
      - name: Build hourly lock key
        id: hourly-slot
        shell: bash
        run: |
          echo "cache_key=update-chinatelecom-hour-$(date -u +'%Y%m%d%H')" >> "$GITHUB_OUTPUT"
      - name: Check whether this hour has already run
        id: hourly-cache
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .github-hourly-run-telecom
          key: ${{ steps.hourly-slot.outputs.cache_key }}
          lookup-only: true
      - name: Explain skipped duplicate
        if: (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && steps.hourly-cache.outputs.cache-hit == 'true'
        run: echo "[*] 电信工作流本小时已经领取过运行时段，跳过本次候选触发。"
      - name: Create hourly running claim
        if: (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && steps.hourly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .github-hourly-run-telecom
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github-hourly-run-telecom/claimed-at.txt
      - name: Save hourly running claim
        if: (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .github-hourly-run-telecom
          key: ${{ steps.hourly-slot.outputs.cache_key }}
      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug workspace
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          pwd
          ls -la
          ls -la "${{ github.workspace }}"
      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ github.workspace }}/requirements.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements.txt"
          else
            echo "requirements.txt not found, fallback to direct install."
            pip install "requests>=2.31.0"
          fi
      - name: Configure Git for incremental publishing
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run updater
        if: github.event_name == 'workflow_dispatch' || steps.hourly-cache.outputs.cache-hit != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          PROVINCE_1: "${{ github.event.inputs.province_1 }}"
          PROVINCE_2: "${{ github.event.inputs.province_2 }}"
          PROVINCE_3: "${{ github.event.inputs.province_3 }}"
          SELECTED_CARRIERS: "${{ github.event.inputs.carriers }}"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$PROVINCE_1" = "定时默认10省电信" ]; then
              echo "[*] 手动运行（定时默认组合）：目标=$AUTO_TARGETS"
              python -u rtp/b.py \
                --targets "$AUTO_TARGETS" \
                --max-pages 10 \
                --max-per-carrier 20 \
                --push
            elif [ "$PROVINCE_1" = "全部" ]; then
              SELECTED_PROVINCES="全部"
              echo "[*] 手动运行：省份=$SELECTED_PROVINCES；运营商=$SELECTED_CARRIERS"
              python -u rtp/b.py \
                --provinces "$SELECTED_PROVINCES" \
                --carriers "$SELECTED_CARRIERS" \
                --max-pages 10 \
                --max-per-carrier 20 \
                --push
            else
              SELECTED_PROVINCES="$PROVINCE_1"
              if [ -n "$PROVINCE_2" ] && [ "$PROVINCE_2" != "不选择" ]; then
                SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_2"
              fi
              if [ -n "$PROVINCE_3" ] && [ "$PROVINCE_3" != "不选择" ]; then
                SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_3"
              fi
              echo "[*] 手动运行：省份=$SELECTED_PROVINCES；运营商=$SELECTED_CARRIERS"
              python -u rtp/b.py \
                --provinces "$SELECTED_PROVINCES" \
                --carriers "$SELECTED_CARRIERS" \
                --max-pages 10 \
                --max-per-carrier 20 \
                --push
            fi
          else
            echo "[*] 定时运行：目标=$AUTO_TARGETS"
            python -u rtp/b.py \
              --targets "$AUTO_TARGETS" \
              --max-pages 10 \
              --max-per-carrier 20 \
              --push
          fi
