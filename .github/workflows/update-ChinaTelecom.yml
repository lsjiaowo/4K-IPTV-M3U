name: Update China Telecom RTP Sources
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "手动运行模式"
        required: true
        default: "测速检查"
        type: choice
        options:
          - "测速检查"
          - "省份抓取"
          - "手动指定 IP:PORT"
      health_file_1:
        description: "指定播放列表1（仅测速检查有效；留空=按原逻辑检查全部）"
        required: false
        default: ""
        type: string
      health_file_2:
        description: "指定播放列表2（仅测速检查有效；留空忽略）"
        required: false
        default: ""
        type: string
      health_file_3:
        description: "指定播放列表3（仅测速检查有效；留空忽略）"
        required: false
        default: ""
        type: string
      health_file_mode:
        description: "指定播放列表处理方式（仅指定播放列表时有效）"
        required: true
        default: "先测速，失败才重新抓取"
        type: choice
        options:
          - "先测速，失败才重新抓取"
          - "不测速旧源，直接重新抓取"
      update_slot:
        description: "更新槽位（仅省份抓取有效）"
        required: true
        default: "全部槽位（默认）"
        type: choice
        options:
          - "全部槽位（默认）"
          - "槽位"
          - "槽位1"
      province_1:
        description: "省份1（仅省份抓取有效；选择全部时忽略省份2/3）"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_2:
        description: "省份2（仅省份抓取有效；测速检查时忽略）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_3:
        description: "省份3（仅省份抓取有效；测速检查时忽略）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      carriers:
        description: "选择运营商组合（仅省份抓取有效；测速检查时忽略）"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "电信"
          - "联通"
          - "移动"
          - "电信,联通"
          - "电信,移动"
          - "联通,移动"
      manual_endpoint_target:
        description: "省份+运营商（仅手动指定 IP:PORT 有效，例如 浙江电信）"
        required: false
        default: ""
        type: string
      manual_endpoint:
        description: "公网 IP:PORT（仅手动指定 IP:PORT 有效，例如 122.246.149.196:8188）"
        required: false
        default: ""
        type: string
      manual_endpoint_action:
        description: "槽位操作（仅手动指定 IP:PORT 有效）"
        required: true
        default: "添加新槽位"
        type: choice
        options:
          - "添加新槽位"
          - "替换指定槽位"
      manual_endpoint_slot:
        description: "替换槽位（仅“替换指定槽位”时填写，例如 浙江电信1；添加新槽位时留空）"
        required: false
        default: ""
        type: string

  # 可选外部整点触发入口；电信工作流使用独立事件类型，避免三个工作流被同一个 dispatch 同时触发。
  repository_dispatch:
    types: [hourly_iptv_telecom_update]

  schedule:
    # 电信定时触发入口保留；实际执行 health / full / disabled 由 SCHEDULE_MODE 控制。
    - cron: "1,6,11,16,21,26 * * * *"

# 三个运营商工作流共用固定并发组：健康检查、完整定时抓取和手动抓取均串行执行，避免同时修改仓库。
concurrency:
  group: iptv-source-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 自动定时模式三选一：health=测速检查；full=全部省份抓取；disabled=关闭所有自动运行（仅允许手动 Run workflow）。
      # 只需修改下面 SCHEDULE_MODE 一行即可切换；手动 workflow_dispatch 不受此设置限制：可选择“测速检查”“省份抓取”或“手动指定 IP:PORT”；省份抓取可选择全部槽位/槽位/槽位1。
      SCHEDULE_MODE: "health"
      # full 模式固定抓取中国大陆全部省份的电信；优先省份顺序由 rtp/b.py 统一控制。
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 明确在任务真正获得并发锁、开始执行时检出最新 main，避免排队期间 GITHUB_SHA 变旧。
          ref: main

      - name: Sync latest main after concurrency wait
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "[*] 已同步到任务实际开始时的最新 origin/main，避免并发排队导致旧基线。"
      - name: Resolve requested mode
        id: mode
        shell: bash
        env:
          MANUAL_MODE: "${{ github.event.inputs.run_mode }}"
          SCHEDULE_EXPR: "${{ github.event.schedule }}"
        run: |
          RUN=false
          MODE=""
          USE_FULL_LOCK=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
            if [ "$MANUAL_MODE" = "测速检查" ]; then
              # 测速检查固定按当前工作流运营商执行；省份1/2/3和运营商组合输入全部忽略。
              MODE="health"
            elif [ "$MANUAL_MODE" = "省份抓取" ]; then
              MODE="full"
            elif [ "$MANUAL_MODE" = "手动指定 IP:PORT" ]; then
              MODE="manual_endpoint"
            else
              echo "::error::手动运行模式只能是 测速检查、省份抓取 或 手动指定 IP:PORT，当前=$MANUAL_MODE"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # 外部自动触发与 schedule 使用同一 SCHEDULE_MODE；disabled 时只记录并跳过，不执行任何任务。
            if [ "$SCHEDULE_MODE" = "health" ]; then
              RUN=true
              MODE="health"
              USE_FULL_LOCK=true
            elif [ "$SCHEDULE_MODE" = "full" ]; then
              RUN=true
              MODE="full"
              USE_FULL_LOCK=true
            elif [ "$SCHEDULE_MODE" = "disabled" ]; then
              echo "[*] SCHEDULE_MODE=disabled：已关闭自动运行，本次 repository_dispatch 跳过；手动 Run workflow 仍可使用。"
            else
              echo "::error::SCHEDULE_MODE 只能是 health、full 或 disabled，当前=$SCHEDULE_MODE"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$SCHEDULE_MODE" = "health" ]; then
              RUN=true
              MODE="health"
              USE_FULL_LOCK=true
            elif [ "$SCHEDULE_MODE" = "full" ]; then
              RUN=true
              MODE="full"
              USE_FULL_LOCK=true
            elif [ "$SCHEDULE_MODE" = "disabled" ]; then
              echo "[*] SCHEDULE_MODE=disabled：已关闭自动运行，本次 schedule 跳过；手动 Run workflow 仍可使用。"
            else
              echo "::error::SCHEDULE_MODE 只能是 health、full 或 disabled，当前=$SCHEDULE_MODE"
              exit 1
            fi
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "use_full_lock=$USE_FULL_LOCK" >> "$GITHUB_OUTPUT"
          echo "[*] event=${{ github.event_name }} schedule=$SCHEDULE_EXPR default=$SCHEDULE_MODE selected=$MODE run=$RUN"

      - name: Build hourly scheduled-run lock key
        id: hourly-slot
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true'
        shell: bash
        run: |
          echo "cache_key=update-chinatelecom-scheduled-hour-$(date -u +'%Y%m%d%H')" >> "$GITHUB_OUTPUT"

      - name: Check whether this hour already ran scheduled task
        id: hourly-cache
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .github-hourly-run-telecom-scheduled
          key: ${{ steps.hourly-slot.outputs.cache_key }}
          lookup-only: true

      - name: Explain skipped duplicate scheduled task
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit == 'true'
        run: echo "[*] 电信定时任务本小时已经领取过运行时段，跳过本次候选触发。"

      - name: Claim hourly scheduled-run slot
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .github-hourly-run-telecom-scheduled
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github-hourly-run-telecom-scheduled/claimed-at.txt

      - name: Save hourly full-scrape claim
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .github-hourly-run-telecom-scheduled
          key: ${{ steps.hourly-slot.outputs.cache_key }}

      - name: Decide whether execution is active
        id: active
        shell: bash
        run: |
          ACTIVE=false
          if [ "${{ steps.mode.outputs.run }}" = "true" ]; then
            if [ "${{ steps.mode.outputs.mode }}" = "health" ]; then
              ACTIVE=true
            elif [ "${{ steps.mode.outputs.use_full_lock }}" != "true" ] || [ "${{ steps.hourly-cache.outputs.cache-hit }}" != "true" ]; then
              ACTIVE=true
            fi
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.active.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug workspace
        if: steps.active.outputs.active == 'true'
        run: |
          pwd
          ls -la
          ls -la "${{ github.workspace }}"

      - name: Install dependencies
        if: steps.active.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ github.workspace }}/requirements.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements.txt"
          else
            echo "requirements.txt not found, fallback to direct install."
            pip install "requests>=2.31.0"
          fi

      - name: Configure Git for incremental publishing
        if: steps.active.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run updater
        if: steps.active.outputs.active == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          IPTV_GIST_ID: ${{ secrets.IPTV_GIST_ID }}
          PROVINCE_1: "${{ github.event.inputs.province_1 }}"
          PROVINCE_2: "${{ github.event.inputs.province_2 }}"
          PROVINCE_3: "${{ github.event.inputs.province_3 }}"
          SELECTED_CARRIERS: "${{ github.event.inputs.carriers }}"
          HEALTH_FILE_1: "${{ github.event.inputs.health_file_1 }}"
          HEALTH_FILE_2: "${{ github.event.inputs.health_file_2 }}"
          HEALTH_FILE_3: "${{ github.event.inputs.health_file_3 }}"
          HEALTH_FILE_MODE: "${{ github.event.inputs.health_file_mode }}"
          UPDATE_SLOT: "${{ github.event.inputs.update_slot }}"
          MANUAL_ENDPOINT_TARGET: "${{ github.event.inputs.manual_endpoint_target }}"
          MANUAL_ENDPOINT: "${{ github.event.inputs.manual_endpoint }}"
          MANUAL_ENDPOINT_ACTION: "${{ github.event.inputs.manual_endpoint_action }}"
          MANUAL_ENDPOINT_SLOT: "${{ github.event.inputs.manual_endpoint_slot }}"
        shell: bash
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "health" ]; then
            HEALTH_ARGS=()
            if [ -n "$HEALTH_FILE_1" ]; then HEALTH_ARGS+=(--health-file-1 "$HEALTH_FILE_1"); fi
            if [ -n "$HEALTH_FILE_2" ]; then HEALTH_ARGS+=(--health-file-2 "$HEALTH_FILE_2"); fi
            if [ -n "$HEALTH_FILE_3" ]; then HEALTH_ARGS+=(--health-file-3 "$HEALTH_FILE_3"); fi

            if [ "$HEALTH_FILE_MODE" = "不测速旧源，直接重新抓取" ]; then
              HEALTH_MODE="refresh"
            else
              HEALTH_MODE="check"
            fi

            if [ ${#HEALTH_ARGS[@]} -gt 0 ]; then
              echo "[*] 电信指定播放列表模式：文件=${HEALTH_FILE_1:-空},${HEALTH_FILE_2:-空},${HEALTH_FILE_3:-空}；处理方式=$HEALTH_FILE_MODE。"
            else
              echo "[*] 电信测速检查：未指定播放列表，按原逻辑检查全部现有电信 M3U；两轮失败才定向修复失效槽位。"
            fi

            python -u rtp/b.py \
              --health-check \
              --health-carriers "电信" \
              "${HEALTH_ARGS[@]}" \
              --health-file-mode "$HEALTH_MODE" \
              --max-pages 10 \
              --max-per-carrier 20 \
              --push
            exit 0
          fi

          if [ "${{ steps.mode.outputs.mode }}" = "manual_endpoint" ]; then
            if [ -z "$MANUAL_ENDPOINT_TARGET" ]; then
              echo "::error::手动指定 IP:PORT 模式必须填写“省份+运营商”。"
              exit 1
            fi
            if [ -z "$MANUAL_ENDPOINT" ]; then
              echo "::error::手动指定 IP:PORT 模式必须填写“公网 IP:PORT”。"
              exit 1
            fi

            if [ "$MANUAL_ENDPOINT_ACTION" = "替换指定槽位" ]; then
              MANUAL_ACTION="replace"
              if [ -z "$MANUAL_ENDPOINT_SLOT" ]; then
                echo "::error::选择“替换指定槽位”时必须填写替换槽位。"
                exit 1
              fi
            else
              MANUAL_ACTION="add"
            fi

            echo "[*] 电信手动 endpoint：目标=$MANUAL_ENDPOINT_TARGET；endpoint=$MANUAL_ENDPOINT；槽位操作=$MANUAL_ENDPOINT_ACTION；槽位=${MANUAL_ENDPOINT_SLOT:-空}"
            python -u rtp/b.py \
              --manual-endpoint-target "$MANUAL_ENDPOINT_TARGET" \
              --manual-endpoint "$MANUAL_ENDPOINT" \
              --manual-endpoint-action "$MANUAL_ACTION" \
              --manual-endpoint-slot "$MANUAL_ENDPOINT_SLOT" \
              --push
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_PROVINCES="$PROVINCE_1"
            if [ -z "$SELECTED_PROVINCES" ]; then SELECTED_PROVINCES="全部"; fi
            if [ "$SELECTED_PROVINCES" != "全部" ]; then
              if [ -n "$PROVINCE_2" ] && [ "$PROVINCE_2" != "不选择" ]; then
                SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_2"
              fi
              if [ -n "$PROVINCE_3" ] && [ "$PROVINCE_3" != "不选择" ]; then
                SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_3"
              fi
            fi
            if [ -z "$SELECTED_CARRIERS" ]; then SELECTED_CARRIERS="全部"; fi
            if [ -z "$UPDATE_SLOT" ]; then UPDATE_SLOT="全部槽位（默认）"; fi
            echo "[*] 手动省份抓取：省份=$SELECTED_PROVINCES；运营商=$SELECTED_CARRIERS；更新槽位=$UPDATE_SLOT"
            python -u rtp/b.py \
              --provinces "$SELECTED_PROVINCES" \
              --carriers "$SELECTED_CARRIERS" \
              --update-slot "$UPDATE_SLOT" \
              --max-pages 10 \
              --max-per-carrier 20 \
              --push
          else
            echo "[*] 电信自动定时 full 模式：抓取中国大陆全部省份；运营商=电信；优先顺序由 b.py 统一控制。"
            python -u rtp/b.py \
              --provinces "全部" \
              --carriers "电信" \
              --max-pages 10 \
              --max-per-carrier 20 \
              --push
          fi
      - name: Sync M3U playlists to Secret Gist
        if: steps.active.outputs.active == 'true'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.IPTV_GIST_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ["GIST_TOKEN"].strip()
          gist_id = os.environ["GIST_ID"].strip()

          if not token:
              raise RuntimeError("GIST_TOKEN is empty")
          if not gist_id:
              raise RuntimeError("IPTV_GIST_ID is empty")

          m3u_dir = Path("m3u")
          files = {}

          for path in sorted(m3u_dir.glob("*.m3u")):
              if path.is_file():
                  files[path.name] = {
                      "content": path.read_text(encoding="utf-8")
                  }

          if not files:
              raise RuntimeError("No .m3u files found under m3u/")

          payload = json.dumps(
              {"files": files},
              ensure_ascii=False
          ).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=payload,
              method="PATCH",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "4K-IPTV-M3U-Gist-Sync",
              },
          )

          with urllib.request.urlopen(req, timeout=120) as response:
              body = response.read().decode("utf-8", errors="replace")
              if response.status != 200:
                  raise RuntimeError(
                      f"Gist sync failed: HTTP {response.status}: {body}"
                  )

          print(f"[*] Secret Gist sync successful: {len(files)} M3U files uploaded.")
          for name in sorted(files):
              print(f"    - {name}")
          PY
