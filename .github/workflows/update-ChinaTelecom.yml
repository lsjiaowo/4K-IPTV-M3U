name: Update China Telecom RTP Sources
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "手动运行模式"
        required: true
        default: "测速检查"
        type: choice
        options:
          - "测速检查"
          - "默认省份抓取"
      province_1:
        description: "省份1（仅默认省份抓取有效；测速检查时忽略）"
        required: true
        default: "定时默认10省电信"
        type: choice
        options:
          - "定时默认10省电信"
          - "全部"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_2:
        description: "省份2（仅默认省份抓取有效；测速检查时忽略）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_3:
        description: "省份3（仅默认省份抓取有效；测速检查时忽略）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      carriers:
        description: "选择运营商组合（仅默认省份抓取有效；测速检查时忽略）"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "电信"
          - "联通"
          - "移动"
          - "电信,联通"
          - "电信,移动"
          - "联通,移动"
  # 可选外部整点触发入口；电信工作流使用独立事件类型，避免两个工作流被同一个 dispatch 同时触发。
  repository_dispatch:
    types: [hourly_iptv_telecom_update]

  schedule:
    # 电信候选窗口放在每小时前半小时（01～26分）；health/full 共用相同候选时间；小时锁保证定时任务每小时最多实际执行一次。
    - cron: "1,6,11,16,21,26 * * * *"

# 两个运营商工作流共用固定并发组：健康检查、完整定时抓取和手动抓取均串行执行，避免同时修改仓库。
concurrency:
  group: iptv-source-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 默认定时模式只能二选一：health=测速检查；full=原来的默认省份完整抓取。
      # 手动 workflow_dispatch 不受此设置限制：可选择“测速检查”或“默认省份抓取”；测速检查时省份/运营商输入全部忽略。
      SCHEDULE_MODE: "health"
      # 电信定时默认10省抓取目标：按下列顺序执行；可直接在此处增加、删除或调整“省份+运营商”。
      AUTO_TARGETS: "四川电信,浙江电信,湖北电信,安徽电信,山西电信,广东电信,湖南电信,河北电信,陕西电信,福建电信"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 明确在任务真正获得并发锁、开始执行时检出最新 main，避免排队期间 GITHUB_SHA 变旧。
          ref: main

      - name: Sync latest main after concurrency wait
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "[*] 已同步到任务实际开始时的最新 origin/main，避免并发排队导致旧基线。"
      - name: Resolve requested mode
        id: mode
        shell: bash
        env:
          MANUAL_MODE: "${{ github.event.inputs.run_mode }}"
          SCHEDULE_EXPR: "${{ github.event.schedule }}"
        run: |
          RUN=false
          MODE=""
          USE_FULL_LOCK=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
            if [ "$MANUAL_MODE" = "测速检查" ]; then
              # 测速检查固定按当前工作流运营商执行；省份1/2/3和运营商组合输入全部忽略。
              MODE="health"
            elif [ "$MANUAL_MODE" = "默认省份抓取" ]; then
              MODE="full"
            else
              echo "::error::手动运行模式只能是 测速检查 或 默认省份抓取，当前=$MANUAL_MODE"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "$SCHEDULE_MODE" = "full" ]; then
              RUN=true
              MODE="full"
              USE_FULL_LOCK=true
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$SCHEDULE_MODE" = "health" ]; then
              RUN=true
              MODE="health"
              USE_FULL_LOCK=true
            elif [ "$SCHEDULE_MODE" = "full" ]; then
              RUN=true
              MODE="full"
              USE_FULL_LOCK=true
            else
              echo "::error::SCHEDULE_MODE 只能是 health 或 full，当前=$SCHEDULE_MODE"
              exit 1
            fi
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "use_full_lock=$USE_FULL_LOCK" >> "$GITHUB_OUTPUT"
          echo "[*] event=${{ github.event_name }} schedule=$SCHEDULE_EXPR default=$SCHEDULE_MODE selected=$MODE run=$RUN"

      - name: Build hourly scheduled-run lock key
        id: hourly-slot
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true'
        shell: bash
        run: |
          echo "cache_key=update-chinatelecom-scheduled-hour-$(date -u +'%Y%m%d%H')" >> "$GITHUB_OUTPUT"

      - name: Check whether this hour already ran scheduled task
        id: hourly-cache
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .github-hourly-run-telecom-scheduled
          key: ${{ steps.hourly-slot.outputs.cache_key }}
          lookup-only: true

      - name: Explain skipped duplicate scheduled task
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit == 'true'
        run: echo "[*] 电信定时任务本小时已经领取过运行时段，跳过本次候选触发。"

      - name: Claim hourly scheduled-run slot
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .github-hourly-run-telecom-scheduled
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github-hourly-run-telecom-scheduled/claimed-at.txt

      - name: Save hourly full-scrape claim
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .github-hourly-run-telecom-scheduled
          key: ${{ steps.hourly-slot.outputs.cache_key }}

      - name: Decide whether execution is active
        id: active
        shell: bash
        run: |
          ACTIVE=false
          if [ "${{ steps.mode.outputs.run }}" = "true" ]; then
            if [ "${{ steps.mode.outputs.mode }}" = "health" ]; then
              ACTIVE=true
            elif [ "${{ steps.mode.outputs.use_full_lock }}" != "true" ] || [ "${{ steps.hourly-cache.outputs.cache-hit }}" != "true" ]; then
              ACTIVE=true
            fi
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.active.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug workspace
        if: steps.active.outputs.active == 'true'
        run: |
          pwd
          ls -la
          ls -la "${{ github.workspace }}"

      - name: Install dependencies
        if: steps.active.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ github.workspace }}/requirements.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements.txt"
          else
            echo "requirements.txt not found, fallback to direct install."
            pip install "requests>=2.31.0"
          fi

      - name: Configure Git for incremental publishing
        if: steps.active.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run updater
        if: steps.active.outputs.active == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          PROVINCE_1: "${{ github.event.inputs.province_1 }}"
          PROVINCE_2: "${{ github.event.inputs.province_2 }}"
          PROVINCE_3: "${{ github.event.inputs.province_3 }}"
          SELECTED_CARRIERS: "${{ github.event.inputs.carriers }}"
        shell: bash
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "health" ]; then
            echo "[*] 电信测速检查：检查全部现有电信 M3U；两轮失败才定向修复失效槽位。"
            python -u rtp/b.py \
              --health-check \
              --health-carriers "电信" \
              --max-pages 10 \
              --max-per-carrier 20 \
              --push
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$PROVINCE_1" = "定时默认10省电信" ]; then
              echo "[*] 手动完整抓取（定时默认组合）：目标=$AUTO_TARGETS"
              python -u rtp/b.py \
                --targets "$AUTO_TARGETS" \
                --max-pages 10 \
                --max-per-carrier 20 \
                --push
            elif [ "$PROVINCE_1" = "全部" ]; then
              SELECTED_PROVINCES="全部"
              echo "[*] 手动完整抓取：省份=$SELECTED_PROVINCES；运营商=$SELECTED_CARRIERS"
              python -u rtp/b.py \
                --provinces "$SELECTED_PROVINCES" \
                --carriers "$SELECTED_CARRIERS" \
                --max-pages 10 \
                --max-per-carrier 20 \
                --push
            else
              SELECTED_PROVINCES="$PROVINCE_1"
              if [ -n "$PROVINCE_2" ] && [ "$PROVINCE_2" != "不选择" ]; then
                SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_2"
              fi
              if [ -n "$PROVINCE_3" ] && [ "$PROVINCE_3" != "不选择" ]; then
                SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_3"
              fi
              echo "[*] 手动完整抓取：省份=$SELECTED_PROVINCES；运营商=$SELECTED_CARRIERS"
              python -u rtp/b.py \
                --provinces "$SELECTED_PROVINCES" \
                --carriers "$SELECTED_CARRIERS" \
                --max-pages 10 \
                --max-per-carrier 20 \
                --push
            fi
          else
            echo "[*] 原默认完整抓取模式：目标=$AUTO_TARGETS"
            python -u rtp/b.py \
              --targets "$AUTO_TARGETS" \
              --max-pages 10 \
              --max-per-carrier 20 \
              --push
          fi
