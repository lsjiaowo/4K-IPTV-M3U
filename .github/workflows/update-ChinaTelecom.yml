name: Update China Telecom RTP Sources
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "手动运行模式"
        required: true
        default: "测速检查"
        type: choice
        options:
          - "测速检查"
          - "全部省份抓取"
      health_file_1:
        description: "指定播放列表1（仅测速检查有效；留空=按原逻辑检查全部）"
        required: false
        default: ""
        type: string
      health_file_2:
        description: "指定播放列表2（仅测速检查有效；留空忽略）"
        required: false
        default: ""
        type: string
      health_file_3:
        description: "指定播放列表3（仅测速检查有效；留空忽略）"
        required: false
        default: ""
        type: string
      health_file_mode:
        description: "指定播放列表处理方式（仅指定播放列表时有效）"
        required: true
        default: "先测速，失败才重新抓取"
        type: choice
        options:
          - "先测速，失败才重新抓取"
          - "不测速旧源，直接重新抓取"
  # 可选外部整点触发入口；电信工作流使用独立事件类型，避免两个工作流被同一个 dispatch 同时触发。
  repository_dispatch:
    types: [hourly_iptv_telecom_update]

  schedule:
    # 电信自动定时触发；实际执行 health 还是 full 由下方 SCHEDULE_MODE 一行控制。
    - cron: "1,6,11,16,21,26 * * * *"

# 三个运营商工作流共用固定并发组：健康检查、完整定时抓取和手动抓取均串行执行，避免同时修改仓库。
concurrency:
  group: iptv-source-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 自动定时任务运行模式：以后只需修改下一行即可切换。
      # health = 测速检查：检查现有电信播放列表，失效后定向修复。
      # full   = 全部省份抓取：遍历中国大陆全部省份，仅抓取电信。
      # 手动 workflow_dispatch 不受此设置限制，可自由选择“测速检查”或“全部省份抓取”。
      SCHEDULE_MODE: "health"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 明确在任务真正获得并发锁、开始执行时检出最新 main，避免排队期间 GITHUB_SHA 变旧。
          ref: main

      - name: Sync latest main after concurrency wait
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "[*] 已同步到任务实际开始时的最新 origin/main，避免并发排队导致旧基线。"
      - name: Resolve requested mode
        id: mode
        shell: bash
        env:
          MANUAL_MODE: "${{ github.event.inputs.run_mode }}"
          SCHEDULE_EXPR: "${{ github.event.schedule }}"
        run: |
          RUN=false
          MODE=""
          USE_FULL_LOCK=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
            if [ "$MANUAL_MODE" = "测速检查" ]; then
              # 测速检查固定按当前工作流运营商执行；省份1/2/3和运营商组合输入全部忽略。
              MODE="health"
            elif [ "$MANUAL_MODE" = "全部省份抓取" ]; then
              MODE="full"
            else
              echo "::error::手动运行模式只能是 测速检查 或 全部省份抓取，当前=$MANUAL_MODE"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "$SCHEDULE_MODE" = "full" ]; then
              RUN=true
              MODE="full"
              USE_FULL_LOCK=true
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$SCHEDULE_MODE" = "health" ]; then
              RUN=true
              MODE="health"
              USE_FULL_LOCK=true
            elif [ "$SCHEDULE_MODE" = "full" ]; then
              RUN=true
              MODE="full"
              USE_FULL_LOCK=true
            else
              echo "::error::SCHEDULE_MODE 只能是 health 或 full，当前=$SCHEDULE_MODE"
              exit 1
            fi
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "use_full_lock=$USE_FULL_LOCK" >> "$GITHUB_OUTPUT"
          echo "[*] event=${{ github.event_name }} schedule=$SCHEDULE_EXPR default=$SCHEDULE_MODE selected=$MODE run=$RUN"

      - name: Build hourly scheduled-run lock key
        id: hourly-slot
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true'
        shell: bash
        run: |
          echo "cache_key=update-chinatelecom-scheduled-hour-$(date -u +'%Y%m%d%H')" >> "$GITHUB_OUTPUT"

      - name: Check whether this hour already ran scheduled task
        id: hourly-cache
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .github-hourly-run-telecom-scheduled
          key: ${{ steps.hourly-slot.outputs.cache_key }}
          lookup-only: true

      - name: Explain skipped duplicate scheduled task
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit == 'true'
        run: echo "[*] 电信定时任务本小时已经领取过运行时段，跳过本次候选触发。"

      - name: Claim hourly scheduled-run slot
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .github-hourly-run-telecom-scheduled
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github-hourly-run-telecom-scheduled/claimed-at.txt

      - name: Save hourly full-scrape claim
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.use_full_lock == 'true' && steps.hourly-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .github-hourly-run-telecom-scheduled
          key: ${{ steps.hourly-slot.outputs.cache_key }}

      - name: Decide whether execution is active
        id: active
        shell: bash
        run: |
          ACTIVE=false
          if [ "${{ steps.mode.outputs.run }}" = "true" ]; then
            if [ "${{ steps.mode.outputs.mode }}" = "health" ]; then
              ACTIVE=true
            elif [ "${{ steps.mode.outputs.use_full_lock }}" != "true" ] || [ "${{ steps.hourly-cache.outputs.cache-hit }}" != "true" ]; then
              ACTIVE=true
            fi
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.active.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Debug workspace
        if: steps.active.outputs.active == 'true'
        run: |
          pwd
          ls -la
          ls -la "${{ github.workspace }}"

      - name: Install dependencies
        if: steps.active.outputs.active == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f "${{ github.workspace }}/requirements.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements.txt"
          else
            echo "requirements.txt not found, fallback to direct install."
            pip install "requests>=2.31.0"
          fi

      - name: Configure Git for incremental publishing
        if: steps.active.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run updater
        if: steps.active.outputs.active == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          IPTV_GIST_ID: ${{ secrets.IPTV_GIST_ID }}
          HEALTH_FILE_1: "${{ github.event.inputs.health_file_1 }}"
          HEALTH_FILE_2: "${{ github.event.inputs.health_file_2 }}"
          HEALTH_FILE_3: "${{ github.event.inputs.health_file_3 }}"
          HEALTH_FILE_MODE: "${{ github.event.inputs.health_file_mode }}"
        shell: bash
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "health" ]; then
            HEALTH_ARGS=()
            if [ -n "$HEALTH_FILE_1" ]; then HEALTH_ARGS+=(--health-file-1 "$HEALTH_FILE_1"); fi
            if [ -n "$HEALTH_FILE_2" ]; then HEALTH_ARGS+=(--health-file-2 "$HEALTH_FILE_2"); fi
            if [ -n "$HEALTH_FILE_3" ]; then HEALTH_ARGS+=(--health-file-3 "$HEALTH_FILE_3"); fi

            if [ "$HEALTH_FILE_MODE" = "不测速旧源，直接重新抓取" ]; then
              HEALTH_MODE="refresh"
            else
              HEALTH_MODE="check"
            fi

            if [ ${#HEALTH_ARGS[@]} -gt 0 ]; then
              echo "[*] 电信指定播放列表模式：文件=${HEALTH_FILE_1:-空},${HEALTH_FILE_2:-空},${HEALTH_FILE_3:-空}；处理方式=$HEALTH_FILE_MODE。"
            else
              echo "[*] 电信测速检查：未指定播放列表，按原逻辑检查全部现有电信 M3U；两轮失败才定向修复失效槽位。"
            fi

            python -u rtp/b.py \
              --health-check \
              --health-carriers "电信" \
              "${HEALTH_ARGS[@]}" \
              --health-file-mode "$HEALTH_MODE" \
              --max-pages 10 \
              --max-per-carrier 20 \
              --push
            exit 0
          fi

          echo "[*] 电信全部省份抓取：遍历中国大陆全部省份；电信/联通优先省份顺序由 b.py 统一控制。"
          python -u rtp/b.py \
            --provinces "全部" \
            --carriers "电信" \
            --max-pages 10 \
            --max-per-carrier 20 \
            --push
      - name: Sync M3U playlists to Secret Gist
        if: steps.active.outputs.active == 'true'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.IPTV_GIST_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ["GIST_TOKEN"].strip()
          gist_id = os.environ["GIST_ID"].strip()

          if not token:
              raise RuntimeError("GIST_TOKEN is empty")
          if not gist_id:
              raise RuntimeError("IPTV_GIST_ID is empty")

          m3u_dir = Path("m3u")
          files = {}

          for path in sorted(m3u_dir.glob("*.m3u")):
              if path.is_file():
                  files[path.name] = {
                      "content": path.read_text(encoding="utf-8")
                  }

          if not files:
              raise RuntimeError("No .m3u files found under m3u/")

          payload = json.dumps(
              {"files": files},
              ensure_ascii=False
          ).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=payload,
              method="PATCH",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "4K-IPTV-M3U-Gist-Sync",
              },
          )

          with urllib.request.urlopen(req, timeout=120) as response:
              body = response.read().decode("utf-8", errors="replace")
              if response.status != 200:
                  raise RuntimeError(
                      f"Gist sync failed: HTTP {response.status}: {body}"
                  )

          print(f"[*] Secret Gist sync successful: {len(files)} M3U files uploaded.")
          for name in sorted(files):
              print(f"    - {name}")
          PY
