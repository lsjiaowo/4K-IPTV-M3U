  repository_dispatch:
    types: [hourly_iptv_telecom_update]
  # ============================================================
  # 【自动定时总开关】已于 2026-10-01 恢复
  # 每小时第 08、28、48 分钟发起；实际任务在 Private Core 串行执行，定时覆盖全部省份
  # 手动 Run workflow 与 repository_dispatch 不受影响
  # ============================================================
  schedule:
    - cron: "8,28,48 * * * *"

concurrency:
  group: iptv-public-dispatch
  queue: single
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-private:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private IPTV runner
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IPTV_GIST_ID: ${{ secrets.IPTV_GIST_ID }}
          IPTV_GIST_PREFIX: ${{ secrets.IPTV_GIST_PREFIX }}
          SOURCE_EVENT: ${{ github.event_name }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
          INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("PRIVATE_REPO_TOKEN", "").strip()
          gist_token = os.environ.get("GIST_TOKEN", "").strip()
          gist_id = os.environ.get("IPTV_GIST_ID", "").strip()
          if not token or not gist_token or not gist_id:
              raise SystemExit("Required private dispatch secret is missing")

          source_event = os.environ.get("SOURCE_EVENT", "").strip()
          run_mode = os.environ.get("RUN_MODE", "").strip()
          raw_inputs = os.environ.get("INPUTS_JSON", "").strip()
          try:
              inputs = json.loads(raw_inputs) if raw_inputs and raw_inputs != "null" else {}
          except json.JSONDecodeError:
              inputs = {}

          if source_event in ("schedule", "repository_dispatch"):
              mode = "health"
          else:
              mode_map = {
                  "测速检查": "health",
                  "定时默认测速": "health",
                  "省份抓取": "full",
                  "手动指定 IP:PORT": "manual_endpoint",
                  "仅更新频道列表": "channel_refresh",
              }
              mode = mode_map.get(run_mode)
              if not mode:
                  raise SystemExit("Unknown manual run mode")

          payload = {
              "event_type": "iptv_private_run",
              "client_payload": {
                  "carrier": "telecom",
                  "label": "电信",
                  "mode": mode,
                  "source_event": source_event,
                  "inputs": inputs,
                  "gist_token": gist_token,
                  "gist_id": gist_id,
                  "gist_prefix": os.environ.get("IPTV_GIST_PREFIX", ""),
                  "private_repo_token": token,
              },
          }
          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY_OWNER']}/4K-IPTV-Core/dispatches",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "4K-IPTV-Public-Dispatcher",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit(f"Private dispatch failed: HTTP {response.status}")
          print("[+] Private IPTV run dispatched. Full live log is available only in 4K-IPTV-Core Actions.")
          PY
