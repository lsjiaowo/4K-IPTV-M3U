  repository_dispatch:
    types: [hourly_iptv_mobile_update]
  # ============================================================
  # 【自动定时总开关】当前：关闭
  # 移动自动定时继续关闭；手动 Run workflow 不受影响
  # 开启=取消 schedule/cron 两行的 #；关闭=给两行加 #
  # ============================================================
  # schedule:
  #   - cron: "16,26,36,46,56 * * * *"

concurrency:
  group: iptv-public-runner
  queue: single
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private core
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: .private-core
          fetch-depth: 0

      - name: Checkout private foldable-log view
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: live-view
          path: .private-view
          fetch-depth: 0

      - name: Sync latest private main after concurrency wait
        shell: bash
        run: |
          set -euo pipefail
          cd .private-core
          git fetch origin main >/dev/null 2>&1
          git checkout -B main origin/main >/dev/null 2>&1
          echo "[*] Latest private core loaded."

      - name: Resolve requested mode
        id: mode
        shell: bash
        env:
          MANUAL_MODE: "${{ github.event.inputs.run_mode }}"
        run: |
          set -euo pipefail
          RUN=false
          MODE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
            case "$MANUAL_MODE" in
              "测速检查"|"定时默认测速") MODE="health" ;;
              "省份抓取") MODE="full" ;;
              "手动指定 IP:PORT") MODE="manual_endpoint" ;;
              "仅更新频道列表") MODE="channel_refresh" ;;
              *) echo "::error::Unknown manual run mode"; exit 1 ;;
            esac
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RUN=true
            MODE="health"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "[*] Run mode resolved."

      - name: Setup Python
        if: steps.mode.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.mode.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install -q -r .private-core/requirements.txt beautifulsoup4
          echo "[*] Runtime dependencies ready."

      - name: Prepare private foldable live log
        if: steps.mode.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.private-view"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live-view >/dev/null 2>&1
          git checkout -B live-view origin/live-view >/dev/null 2>&1
          mkdir -p private_logs/live
          echo "[*] Private foldable live-log channel ready."

      - name: Run private updater on public runner
        if: steps.mode.outputs.run == 'true'
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IPTV_WORKSPACE_ROOT: ${{ github.workspace }}/.private-core/private_workspace
          IPTV_STATE_ROOT: ${{ github.workspace }}/.private-core
          IPTV_DISABLE_README_UPDATE: "1"
          LOG_CARRIER: "mobile"
        run: |
          set -u
          FULL_LOG="$RUNNER_TEMP/iptv-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          LIVE_VIEW_STOP="$RUNNER_TEMP/private-live-view.stop"
          echo "IPTV_FULL_LOG=$FULL_LOG" >> "$GITHUB_ENV"
          touch "$FULL_LOG"
          rm -f "$LIVE_VIEW_STOP"

          cat > "$RUNNER_TEMP/private_live_view_sync.py" <<'PY'
          import html
          import os
          import subprocess
          import sys
          import time
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          log_path = Path(sys.argv[1])
          view_dir = Path(sys.argv[2])
          carrier = sys.argv[3]
          stop_path = Path(sys.argv[4])

          view_out_dir = view_dir / "private_logs" / "live"
          view_out_dir.mkdir(parents=True, exist_ok=True)
          target_md = view_out_dir / f"{carrier}.md"

          carrier_name = {
              "telecom": "电信",
              "unicom": "联通",
              "mobile": "移动",
          }.get(carrier, carrier)

          def run_git(args):
              return subprocess.run(
                  ["git", *args],
                  cwd=view_dir,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )

          def render_markdown(text):
              preamble = []
              groups = []
              current_title = None
              current_lines = []

              for line in text.splitlines():
                  if line.startswith("::group::"):
                      if current_title is not None:
                          groups.append((current_title, current_lines, False))
                      current_title = line[len("::group::"):].strip()
                      current_lines = []
                  elif line.strip() == "::endgroup::":
                      if current_title is not None:
                          groups.append((current_title, current_lines, True))
                          current_title = None
                          current_lines = []
                  elif current_title is None:
                      preamble.append(line)
                  else:
                      current_lines.append(line)

              if current_title is not None:
                  groups.append((current_title, current_lines, False))

              beijing_tz = timezone(timedelta(hours=8))
              updated_at = datetime.now(beijing_tz).strftime("%Y-%m-%d %H:%M:%S GMT+8")
              lines = [
                  f"# {carrier_name}实时运行日志",
                  "",
                  f"> Run ID：`{os.environ.get('GITHUB_RUN_ID', '')}`  ",
                  f"> 更新时间（北京时间）：`{updated_at}`  ",
                  "> 已完成省份默认折叠；当前正在运行的省份默认展开。",
                  "",
              ]

              if preamble:
                  lines += [
                      "## 任务概览",
                      "",
                      "<pre>",
                      html.escape("\n".join(preamble)),
                      "</pre>",
                      "",
                  ]

              if not groups:
                  lines += ["_等待省份日志输出。_", ""]
              else:
                  for title, body, closed in groups:
                      running = not closed
                      lines.append("<details open>" if running else "<details>")
                      suffix = "（运行中）" if running else ""
                      lines.append(
                          f"<summary><strong>{html.escape(title)}{suffix}</strong></summary>"
                      )
                      lines += [
                          "",
                          "<pre>",
                          html.escape("\n".join(body)),
                          "</pre>",
                          "",
                          "</details>",
                          "",
                      ]

              return "\n".join(lines).rstrip() + "\n"

          def sync_once():
              if not log_path.exists():
                  return True

              text = log_path.read_text(encoding="utf-8", errors="replace")
              target_md.write_text(render_markdown(text), encoding="utf-8")

              run_git(["add", str(target_md.relative_to(view_dir))])
              if run_git(["diff", "--cached", "--quiet"]).returncode == 0:
                  return True

              if run_git(["commit", "--amend", "--no-edit"]).returncode != 0:
                  run_git(["reset"])
                  return False

              for _ in range(3):
                  if run_git(["push", "--force", "origin", "HEAD:live-view"]).returncode == 0:
                      return True
                  time.sleep(2)
              return False

          # 单一同步进程负责整个生命周期；收到 stop 文件后完成最后一次同步再退出。
          # 这样不会再出现“杀掉后台进程后，残留 git 子进程与最终同步抢锁”的竞态。
          while not stop_path.exists():
              sync_once()
              for _ in range(30):
                  if stop_path.exists():
                      break
                  time.sleep(1)

          raise SystemExit(0 if sync_once() else 1)
          PY

          python "$RUNNER_TEMP/private_live_view_sync.py"             "$FULL_LOG" "${GITHUB_WORKSPACE}/.private-view" "$LOG_CARRIER" "$LIVE_VIEW_STOP"             >/dev/null 2>&1 &
          LIVE_VIEW_SYNC_PID=$!

          set +e
          python -u .private-core/runner.py             --carrier "mobile"             --mode "${{ steps.mode.outputs.mode }}"             --event-name "${{ github.event_name }}"             >"$FULL_LOG" 2>&1
          RUN_CODE=$?
          set -e

          # 优雅停止实时同步：等待正在进行的 git 操作结束，再由同一进程完成最终同步。
          touch "$LIVE_VIEW_STOP"
          set +e
          wait "$LIVE_VIEW_SYNC_PID"
          LIVE_VIEW_CODE=$?
          set -e

          if [ "$LIVE_VIEW_CODE" -ne 0 ]; then
            echo "::warning::Private foldable live-log final synchronization failed after retries; updater result is unaffected."
          fi

          if [ "$RUN_CODE" -eq 0 ]; then
            echo "[+] Mobile updater completed on the public runner. Detailed log stayed private."
          else
            echo "::error::Mobile updater failed. Detailed log is available only in the private foldable live view."
            exit "$RUN_CODE"
          fi

      - name: Persist private state and final log
        if: always() && steps.mode.outputs.run == 'true'
        shell: bash
        env:
          FULL_LOG: ${{ env.IPTV_FULL_LOG }}
          LOG_CARRIER: "mobile"
        run: |
          set -euo pipefail
          LOG_PATH="$FULL_LOG"
          cd .private-core

          mkdir -p "private_logs/archive/$LOG_CARRIER"
          if [ -f "$LOG_PATH" ]; then
            cp "$LOG_PATH" "private_logs/archive/$LOG_CARRIER/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md private_workspace history/usable_endpoints.txt private_logs/archive
          if git diff --cached --quiet; then
            echo "[*] No private state changes."
            exit 0
          fi

          git commit -m "Update private IPTV state from public run ${GITHUB_RUN_ID}" >/dev/null

          # 正式任务使用同一个 Public concurrency 锁，正常情况下 main 不会在运行中变化。
          # 只有远端真的前进时才 rebase；否则直接 push，避免运行时残留文件无意义阻塞 rebase。
          for attempt in 1 2 3; do
            git fetch origin main >/dev/null 2>&1
            REMOTE_SHA="$(git rev-parse origin/main)"
            PARENT_SHA="$(git rev-parse HEAD^)"

            if [ "$REMOTE_SHA" != "$PARENT_SHA" ]; then
              echo "[*] Private main advanced during this run; reconciling generated state (attempt $attempt/3)."
              # 所有需要保留的生成状态已经进入当前提交；清除 Python 缓存等运行时残留后再 rebase。
              git reset --hard HEAD >/dev/null
              git clean -fd >/dev/null
              if ! git rebase -X theirs origin/main >/dev/null 2>&1; then
                git rebase --abort >/dev/null 2>&1 || true
                echo "::error::Unable to reconcile generated private state with current main."
                exit 1
              fi
            fi

            if git push origin HEAD:main >/dev/null 2>&1; then
              echo "[+] Playlist state and final log persisted privately."
              exit 0
            fi

            echo "::warning::Private main changed before push; retrying persistence ($attempt/3)."
            sleep 2
          done

          echo "::error::Private state persistence failed after 3 attempts."
          exit 1
