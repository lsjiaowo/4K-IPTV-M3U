name: Inspect myTV Sync Gist

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-mytv-sync-gist.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cloud-sync Gist safely
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          gist_id = "9c739f61eb0bafa7b59e935a99523183"
          req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {os.environ['GIST_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "mytv-sync-inspector",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)

          files = data.get("files") or {}
          old_id = "151462a1b2deeb3816e2f4ce3b3b44b1"
          new_id = "de49ae260221e2d7088193d8f67a3769"

          print(f"files={len(files)}")
          for name, meta in files.items():
              content = meta.get("content") or ""
              print(
                  f"file={name} size={len(content)} "
                  f"old_playlist_refs={content.count(old_id)} "
                  f"new_playlist_refs={content.count(new_id)} "
                  f"gist_raw_refs={content.count('gist.githubusercontent.com')} "
                  f"http_refs={content.count('http://') + content.count('https://')}"
              )
              try:
                  parsed = json.loads(content)
                  if isinstance(parsed, dict):
                      keys = sorted(str(k) for k in parsed.keys())
                      print(f"top_keys={name}:{','.join(keys[:80])}")
              except Exception:
                  pass
          PY
