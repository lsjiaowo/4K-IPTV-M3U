        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      health_carrier:
        description: "测速运营商（仅测速检查→指定省份+运营商有效）"
        required: true
        default: "联通"
        type: choice
        options:
          - "联通"
          - "电信"
          - "移动"
          - "全部"
      health_file_1:
        description: "指定播放列表1（仅测速检查→指定播放列表有效；例如 山西电信.m3u）"
        required: false
        default: ""
        type: string
      health_file_2:
        description: "指定播放列表2（仅测速检查→指定播放列表有效；留空忽略）"
        required: false
        default: ""
        type: string
      health_file_3:
        description: "指定播放列表3（仅测速检查→指定播放列表有效；留空忽略）"
        required: false
        default: ""
        type: string
      health_file_mode:
        description: "指定播放列表处理方式（仅测速检查→指定播放列表有效）"
        required: true
        default: "先测速，失败才重新抓取"
        type: choice
        options:
          - "先测速，失败才重新抓取"
          - "不测速旧源，直接重新抓取"

      update_slot:
        description: "━━━━━━ ② 省份抓取 ━━━━━━ 更新槽位"
        required: true
        default: "全部槽位（默认）"
        type: choice
        options:
          - "全部槽位（默认）"
          - "槽位"
          - "槽位1"
      existing_complete_mode:
        description: "已有完整槽位处理（仅‘全部省份抓取’+‘全部槽位’有效）"
        required: true
        default: "全部重新抓取（默认）"
        type: choice
        options:
          - "全部重新抓取（默认）"
          - "跳过已有完整槽位"
      province_1:
        description: "省份1（仅省份抓取有效；选择全部时忽略省份2/3）"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_2:
        description: "省份2（仅省份抓取有效）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      province_3:
        description: "省份3（仅省份抓取有效）"
        required: true
        default: "不选择"
        type: choice
        options:
          - "不选择"
          - "北京"
          - "天津"
          - "河北"
          - "山西"
          - "内蒙古"
          - "辽宁"
          - "吉林"
          - "黑龙江"
          - "上海"
          - "江苏"
          - "浙江"
          - "安徽"
          - "福建"
          - "江西"
          - "山东"
          - "河南"
          - "湖北"
          - "湖南"
          - "广东"
          - "广西"
          - "海南"
          - "重庆"
          - "四川"
          - "贵州"
          - "云南"
          - "陕西"
          - "甘肃"
          - "青海"
          - "宁夏"
          - "新疆"
          - "台湾"
          - "俄罗斯"
          - "韩国"
      carriers:
        description: "选择运营商组合（仅省份抓取有效）"
        required: true
        default: "全部"
        type: choice
        options:
          - "全部"
          - "电信"
          - "联通"
          - "移动"
          - "电信,联通"
          - "电信,移动"
          - "联通,移动"

      manual_endpoint_target:
        description: "━━━━━━ ③ 手动指定 IP:PORT ━━━━━━ 省份+运营商（例如 浙江电信）"
        required: false
        default: ""
        type: string
      manual_endpoint:
        description: "公网 IP:PORT（仅手动指定 IP:PORT 有效，例如 122.246.149.196:8188）"
        required: false
        default: ""
        type: string
      manual_endpoint_action:
        description: "槽位操作（仅手动指定 IP:PORT 有效）"
        required: true
        default: "添加新槽位"
        type: choice
        options:
          - "添加新槽位"
          - "替换指定槽位"
      manual_endpoint_slot:
        description: "替换槽位（仅‘替换指定槽位’时填写；例如 浙江电信1；添加新槽位时留空）"
        required: false
        default: ""
        type: string

      channel_refresh_target:
        description: "━━━━━━ ④ 仅更新频道列表 ━━━━━━ 频道列表目标（例如 河南电信）"
        required: false
        default: ""
        type: string
      channel_refresh_slot:
        description: "更新槽位（仅更新频道列表有效；不创建缺失槽位，最多只处理主槽位和槽位1）"
        required: true
        default: "全部现有槽位"
        type: choice
        options:
          - "全部现有槽位"
          - "槽位"
          - "槽位1"

  repository_dispatch:
    types: [hourly_iptv_unicom_update]
  # ============================================================
  # 【自动定时总开关】当前：开启
  # 开启=取消 schedule/cron 两行的 #；关闭=给两行加 #；手动运行不受影响
  # ============================================================
  #schedule:
  #  - cron: "31,36,41,46,51,56 * * * *"

concurrency:
  group: iptv-source-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 自动定时模式：health=测速检查；full=全国本运营商抓取；disabled=关闭自动运行。
      # 手动 Run workflow 不受该设置限制。
      SCHEDULE_MODE: "health"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest main after concurrency wait
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "[*] 已同步到任务实际开始时的最新 origin/main。"

      - name: Configure Git identity
        shell: bash
        run: |
          # push_to_github() 会在 b.py 内执行 git commit；Actions runner 必须先有提交者身份。
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "[*] Git 提交身份已配置为 github-actions[bot]。"

      - name: Resolve requested mode
        id: mode
        shell: bash
        env:
          MANUAL_MODE: "${{ github.event.inputs.run_mode }}"
        run: |
          RUN=false
          MODE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
            case "$MANUAL_MODE" in
              "测速检查") MODE="health" ;;
              "省份抓取") MODE="full" ;;
              "手动指定 IP:PORT") MODE="manual_endpoint" ;;
              "仅更新频道列表") MODE="channel_refresh" ;;
              *) echo "::error::未知手动运行模式：$MANUAL_MODE"; exit 1 ;;
            esac
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "$SCHEDULE_MODE" = "health" ] || [ "$SCHEDULE_MODE" = "full" ]; then
              RUN=true
              MODE="$SCHEDULE_MODE"
            elif [ "$SCHEDULE_MODE" = "disabled" ]; then
              echo "[*] 自动运行已关闭。"
            else
              echo "::error::SCHEDULE_MODE 只能是 health/full/disabled，当前=$SCHEDULE_MODE"
              exit 1
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "[*] event=${{ github.event_name }} mode=$MODE run=$RUN"

      - name: Setup Python
        if: steps.mode.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.mode.outputs.run == 'true'
        run: pip install requests beautifulsoup4

      - name: Run updater
        if: steps.mode.outputs.run == 'true'
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IPTV_GIST_ID: ${{ secrets.IPTV_GIST_ID }}
          HEALTH_SCOPE: "${{ github.event.inputs.health_scope }}"
          HEALTH_PROVINCE: "${{ github.event.inputs.health_province }}"
          HEALTH_CARRIER: "${{ github.event.inputs.health_carrier }}"
          HEALTH_FILE_1: "${{ github.event.inputs.health_file_1 }}"
          HEALTH_FILE_2: "${{ github.event.inputs.health_file_2 }}"
          HEALTH_FILE_3: "${{ github.event.inputs.health_file_3 }}"
          HEALTH_FILE_MODE: "${{ github.event.inputs.health_file_mode }}"
          UPDATE_SLOT: "${{ github.event.inputs.update_slot }}"
          EXISTING_COMPLETE_MODE: "${{ github.event.inputs.existing_complete_mode }}"
          PROVINCE_1: "${{ github.event.inputs.province_1 }}"
          PROVINCE_2: "${{ github.event.inputs.province_2 }}"
          PROVINCE_3: "${{ github.event.inputs.province_3 }}"
          SELECTED_CARRIERS: "${{ github.event.inputs.carriers }}"
          MANUAL_ENDPOINT_TARGET: "${{ github.event.inputs.manual_endpoint_target }}"
          MANUAL_ENDPOINT: "${{ github.event.inputs.manual_endpoint }}"
          MANUAL_ENDPOINT_ACTION: "${{ github.event.inputs.manual_endpoint_action }}"
          MANUAL_ENDPOINT_SLOT: "${{ github.event.inputs.manual_endpoint_slot }}"
          CHANNEL_REFRESH_TARGET: "${{ github.event.inputs.channel_refresh_target }}"
          CHANNEL_REFRESH_SLOT: "${{ github.event.inputs.channel_refresh_slot }}"
        run: |
          set -euo pipefail
          MODE="${{ steps.mode.outputs.mode }}"

          if [ "$MODE" = "health" ]; then
            HEALTH_ARGS=()
            HEALTH_MODE="check"
            if [ "$HEALTH_FILE_MODE" = "不测速旧源，直接重新抓取" ]; then HEALTH_MODE="refresh"; fi

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$HEALTH_SCOPE" = "指定播放列表" ]; then
              [ -n "$HEALTH_FILE_1" ] && HEALTH_ARGS+=(--health-file-1 "$HEALTH_FILE_1")
              [ -n "$HEALTH_FILE_2" ] && HEALTH_ARGS+=(--health-file-2 "$HEALTH_FILE_2")
              [ -n "$HEALTH_FILE_3" ] && HEALTH_ARGS+=(--health-file-3 "$HEALTH_FILE_3")
              if [ ${#HEALTH_ARGS[@]} -eq 0 ]; then
                echo "::error::选择‘指定播放列表’后，至少填写一个指定播放列表。"
                exit 1
              fi
              echo "[*] 测速检查范围=指定播放列表；文件=$HEALTH_FILE_1,$HEALTH_FILE_2,$HEALTH_FILE_3；处理方式=$HEALTH_FILE_MODE。"
              python -u rtp/b.py --health-check --health-carriers "全部" "${HEALTH_ARGS[@]}" --health-file-mode "$HEALTH_MODE" --max-pages 10 --max-per-carrier 20 --min-stream-speed 0.5859375 --push
            else
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                HP="${HEALTH_PROVINCE:-全部}"
                HC="${HEALTH_CARRIER:-联通}"
              else
                HP="全部"
                HC="联通"
              fi
              echo "[*] 测速检查范围=指定省份+运营商；省份=$HP；运营商=$HC。只处理现有对应组；组内仅允许主槽位和槽位1，缺1个时自动尝试补齐。"
              python -u rtp/b.py --health-check --health-provinces "$HP" --health-carriers "$HC" --health-file-mode check --max-pages 10 --max-per-carrier 20 --min-stream-speed 0.5859375 --push
            fi
            exit 0
          fi

          if [ "$MODE" = "channel_refresh" ]; then
            if [ -z "$CHANNEL_REFRESH_TARGET" ]; then
              echo "::error::仅更新频道列表模式必须填写‘频道列表目标’，例如 河南电信。"
              exit 1
            fi
            case "$CHANNEL_REFRESH_SLOT" in
              "槽位") REFRESH_SLOT="base" ;;
              "槽位1") REFRESH_SLOT="1" ;;
              *) REFRESH_SLOT="all" ;;
            esac
            echo "[*] 仅更新频道列表：目标=$CHANNEL_REFRESH_TARGET；槽位=$CHANNEL_REFRESH_SLOT。"
            echo "[*] 本模式只读取本地 channel_templates；不访问 cqshushu、不抓取 IP:PORT、不测速、不创建缺失槽位。"
            python -u rtp/b.py --channel-refresh-target "$CHANNEL_REFRESH_TARGET" --channel-refresh-slot "$REFRESH_SLOT" --push
            exit 0
          fi

          if [ "$MODE" = "manual_endpoint" ]; then
            if [ -z "$MANUAL_ENDPOINT_TARGET" ] || [ -z "$MANUAL_ENDPOINT" ]; then
              echo "::error::手动指定 IP:PORT 模式必须填写‘省份+运营商’和‘公网 IP:PORT’。"
              exit 1
            fi
            if [ "$MANUAL_ENDPOINT_ACTION" = "替换指定槽位" ]; then
              [ -n "$MANUAL_ENDPOINT_SLOT" ] || { echo "::error::替换指定槽位时必须填写替换槽位。"; exit 1; }
              ACTION="replace"
            else
              ACTION="add"
            fi
            ARGS=(--manual-endpoint-target "$MANUAL_ENDPOINT_TARGET" --manual-endpoint "$MANUAL_ENDPOINT" --manual-endpoint-action "$ACTION")
            [ "$ACTION" = "replace" ] && ARGS+=(--manual-endpoint-slot "$MANUAL_ENDPOINT_SLOT")
            python -u rtp/b.py "${ARGS[@]}" --max-pages 10 --max-per-carrier 20 --min-stream-speed 0.5859375 --push
            exit 0
          fi

          # 省份抓取
          SLOT="all"
          [ "$UPDATE_SLOT" = "槽位" ] && SLOT="base"
          [ "$UPDATE_SLOT" = "槽位1" ] && SLOT="1"
          COMPLETE_MODE="all"
          [ "$EXISTING_COMPLETE_MODE" = "跳过已有完整槽位" ] && COMPLETE_MODE="skip"
          SELECTED_PROVINCES="$PROVINCE_1"
          if [ "$PROVINCE_1" != "全部" ]; then
            [ -n "$PROVINCE_2" ] && [ "$PROVINCE_2" != "不选择" ] && SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_2"
            [ -n "$PROVINCE_3" ] && [ "$PROVINCE_3" != "不选择" ] && SELECTED_PROVINCES="$SELECTED_PROVINCES,$PROVINCE_3"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[*] 省份抓取：省份=$SELECTED_PROVINCES；运营商=$SELECTED_CARRIERS；更新槽位=$UPDATE_SLOT；已有完整槽位处理=$EXISTING_COMPLETE_MODE。"
            python -u rtp/b.py --provinces "$SELECTED_PROVINCES" --carriers "$SELECTED_CARRIERS" --update-slot "$SLOT" --existing-complete-mode "$COMPLETE_MODE" --max-pages 10 --max-per-carrier 20 --min-stream-speed 0.5859375 --push
          else
            echo "[*] 自动全国抓取：全部省份；运营商=联通。"
            python -u rtp/b.py --provinces "全部" --carriers "联通" --update-slot all --existing-complete-mode all --max-pages 10 --max-per-carrier 20 --min-stream-speed 0.5859375 --push
          fi

      - name: Final fallback sync all M3U playlists to Secret Gist
        if: steps.mode.outputs.run == 'true' && success()
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.IPTV_GIST_ID }}
        run: |
          python - <<'PY2'
          import glob, os, requests
          token=os.environ.get("GIST_TOKEN", "").strip(); gist_id=os.environ.get("GIST_ID", "").strip()
          if not token or not gist_id:
              raise SystemExit("GIST_TOKEN / IPTV_GIST_ID 未配置")
          files={os.path.basename(p): {"content": open(p, encoding="utf-8").read()} for p in sorted(glob.glob("m3u/*.m3u"))}
          if not files: raise SystemExit("没有可同步的 m3u/*.m3u")
          r=requests.patch(f"https://api.github.com/gists/{gist_id}", headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"}, json={"files":files}, timeout=120)
          r.raise_for_status()
          returned=set(r.json().get("files", {}))
          missing=set(files)-returned
          if missing: raise SystemExit("Gist 返回缺少文件: "+", ".join(sorted(missing)))
          print(f"[+] Secret Gist 最终兜底同步完成：{len(files)} 个 M3U。")
          PY2
