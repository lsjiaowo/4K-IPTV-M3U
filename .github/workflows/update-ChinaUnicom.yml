  repository_dispatch:
    types: [hourly_iptv_unicom_update]
  # ============================================================
  # 【自动定时总开关】已于 2026-10-01 恢复
  # 北京时间每天 04:17、14:17 自动运行
  # 手动 Run workflow 与 repository_dispatch 不受影响
  # ============================================================
  schedule:
    - cron: "17 6,20 * * *"

concurrency:
  group: iptv-source-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-core
          fetch-depth: 1

      - name: Sync latest main after concurrency wait
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "[*] 已同步到任务实际开始时的最新 origin/main。"

      - name: Configure Git identity
        shell: bash
        run: |
          # push_to_github() 会在 b.py 内执行 git commit；Actions runner 必须先有提交者身份。
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "[*] Git 提交身份已配置为 github-actions[bot]。"

      - name: Resolve requested mode
        id: mode
        shell: bash
        env:
          MANUAL_MODE: "${{ github.event.inputs.run_mode }}"
        run: |
          RUN=false
          MODE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
            case "$MANUAL_MODE" in
              "测速检查"|"定时默认测速") MODE="health" ;;
              "省份抓取") MODE="full" ;;
              "手动指定 IP:PORT") MODE="manual_endpoint" ;;
              "仅更新频道列表") MODE="channel_refresh" ;;
              *) echo "::error::未知手动运行模式"; exit 1 ;;
            esac
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RUN=true
            MODE="health"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "[*] Private core mode resolved."

      - name: Setup Python
        if: steps.mode.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.mode.outputs.run == 'true'
        run: pip install -r .private-core/requirements.txt beautifulsoup4

      - name: Run private updater
        if: steps.mode.outputs.run == 'true'
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IPTV_GIST_ID: ${{ secrets.IPTV_GIST_ID }}
          IPTV_GIST_PREFIX: ${{ secrets.IPTV_GIST_PREFIX }}
          IPTV_WORKSPACE_ROOT: ${{ github.workspace }}/.private-core/private_workspace
          IPTV_STATE_ROOT: ${{ github.workspace }}/.private-core
          IPTV_DISABLE_README_UPDATE: "1"
        run: |
          set -euo pipefail
          FULL_LOG="$RUNNER_TEMP/iptv-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "IPTV_FULL_LOG=$FULL_LOG" >> "$GITHUB_ENV"
          exec 3>&1 4>&2
          finish() {
            code=$?
            trap - EXIT
            if [ "$code" -eq 0 ]; then
              echo "[+] Private updater completed successfully. Full details are private." >&3
            else
              echo "::error::Private updater failed. Full details are private." >&3
            fi
            exit "$code"
          }
          trap finish EXIT
          exec >"$FULL_LOG" 2>&1
          python -u .private-core/runner.py --carrier "unicom" --mode "${{ steps.mode.outputs.mode }}" --event-name "${{ github.event_name }}"

      - name: Persist private playlist state
        if: always() && steps.mode.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd .private-core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add private_workspace history/usable_endpoints.txt
          if git diff --cached --quiet; then
            echo "[*] No private playlist state changes."
            exit 0
          fi
          git commit -m "Update private IPTV state from run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "[+] Private playlist state persisted."

      - name: Archive full log privately
        if: always() && steps.mode.outputs.run == 'true'
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          FULL_LOG: ${{ env.IPTV_FULL_LOG }}
          LOG_CARRIER: "unicom"
        run: |
          python - <<'PYLOG'
          import base64
          import os
          from pathlib import Path
          import requests

          token = os.environ.get("PRIVATE_REPO_TOKEN", "").strip()
          log_path = Path(os.environ.get("FULL_LOG", ""))
          carrier = os.environ.get("LOG_CARRIER", "unknown")
          if not token:
              raise SystemExit("PRIVATE_REPO_TOKEN 未配置")
          if not log_path.is_file():
              raise SystemExit("完整日志文件不存在")

          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          target = f"logs/{carrier}/{run_id}-{attempt}.log"
          api = f"https://api.github.com/repos/{owner}/4K-IPTV-Logs/contents/{target}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          payload = {
              "message": f"Archive {carrier} run {run_id} attempt {attempt}",
              "content": base64.b64encode(log_path.read_bytes()).decode("ascii"),
          }
          existing = requests.get(api, headers=headers, timeout=30)
          if existing.status_code == 200:
              payload["sha"] = existing.json()["sha"]
          elif existing.status_code != 404:
              existing.raise_for_status()

          response = requests.put(api, headers=headers, json=payload, timeout=120)
          response.raise_for_status()
          print("[+] Full log archived in private repository.")
          PYLOG
