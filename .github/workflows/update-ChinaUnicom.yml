        required: false
        default: ""
        type: string
      channel_refresh_slot:
        description: "更新槽位（仅更新频道列表有效；不创建缺失槽位，最多只处理主槽位和槽位1）"
        required: true
        default: "全部现有槽位"
        type: choice
        options:
          - "全部现有槽位"
          - "槽位"
