  repository_dispatch:
    types: [hourly_iptv_unicom_update]
  # ============================================================
  # 【自动定时总开关】已于 2026-10-01 恢复
  # 每小时第 18、38、58 分钟发起；实际长任务在本 Public Runner 串行执行，定时覆盖全部省份
  # 手动 Run workflow 与 repository_dispatch 不受影响
  # ============================================================
  schedule:
    - cron: "18,38,58 * * * *"

concurrency:
  group: iptv-public-runner
  queue: single
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private core
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: .private-core
          fetch-depth: 0

      - name: Checkout private live-log branch
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: live-logs
          path: .private-live
          fetch-depth: 0

      - name: Checkout private foldable-log view
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: live-view
          path: .private-view
          fetch-depth: 0

      - name: Sync latest private main after concurrency wait
        shell: bash
        run: |
          set -euo pipefail
          cd .private-core
          git fetch origin main >/dev/null 2>&1
          git checkout -B main origin/main >/dev/null 2>&1
          echo "[*] Latest private core loaded."

      - name: Resolve requested mode
        id: mode
        shell: bash
        env:
          MANUAL_MODE: "${{ github.event.inputs.run_mode }}"
        run: |
          set -euo pipefail
          RUN=false
          MODE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
            case "$MANUAL_MODE" in
              "测速检查"|"定时默认测速") MODE="health" ;;
              "省份抓取") MODE="full" ;;
              "手动指定 IP:PORT") MODE="manual_endpoint" ;;
              "仅更新频道列表") MODE="channel_refresh" ;;
              *) echo "::error::Unknown manual run mode"; exit 1 ;;
            esac
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RUN=true
            MODE="health"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "[*] Run mode resolved."

      - name: Setup Python
        if: steps.mode.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.mode.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install -q -r .private-core/requirements.txt beautifulsoup4
          echo "[*] Runtime dependencies ready."

      - name: Prepare private live log
        if: steps.mode.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd .private-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live-logs >/dev/null 2>&1
          git checkout -B live-logs origin/live-logs >/dev/null 2>&1
          mkdir -p private_logs/live

          cd "${GITHUB_WORKSPACE}/.private-view"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live-view >/dev/null 2>&1
          git checkout -B live-view origin/live-view >/dev/null 2>&1
          mkdir -p private_logs/live

          echo "[*] Private raw-log and foldable-log channels ready."

      - name: Run private updater on public runner
        if: steps.mode.outputs.run == 'true'
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          IPTV_WORKSPACE_ROOT: ${{ github.workspace }}/.private-core/private_workspace
          IPTV_STATE_ROOT: ${{ github.workspace }}/.private-core
          IPTV_DISABLE_README_UPDATE: "1"
          LOG_CARRIER: "unicom"
        run: |
          set -u
          FULL_LOG="$RUNNER_TEMP/iptv-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          echo "IPTV_FULL_LOG=$FULL_LOG" >> "$GITHUB_ENV"
          touch "$FULL_LOG"

          cat > "$RUNNER_TEMP/private_live_sync.py" <<'PY'
          import html
          import json
          import os
          import shutil
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path(sys.argv[1])
          live_dir = Path(sys.argv[2])
          view_dir = Path(sys.argv[3])
          carrier = sys.argv[4]
          once = "--once" in sys.argv[5:]

          raw_dir = live_dir / "private_logs" / "live"
          view_out_dir = view_dir / "private_logs" / "live"
          raw_dir.mkdir(parents=True, exist_ok=True)
          view_out_dir.mkdir(parents=True, exist_ok=True)

          target_log = raw_dir / f"{carrier}.log"
          target_status = raw_dir / f"{carrier}.json"
          target_md = view_out_dir / f"{carrier}.md"

          carrier_name = {
              "telecom": "电信",
              "unicom": "联通",
              "mobile": "移动",
          }.get(carrier, carrier)

          def run_git(repo_dir, args):
              return subprocess.run(
                  ["git", *args],
                  cwd=repo_dir,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )

          def render_markdown(text, status):
              preamble = []
              groups = []
              current_title = None
              current_lines = []

              for line in text.splitlines():
                  if line.startswith("::group::"):
                      if current_title is not None:
                          groups.append((current_title, current_lines, False))
                      current_title = line[len("::group::"):].strip()
                      current_lines = []
                  elif line.strip() == "::endgroup::":
                      if current_title is not None:
                          groups.append((current_title, current_lines, True))
                          current_title = None
                          current_lines = []
                  elif current_title is None:
                      preamble.append(line)
                  else:
                      current_lines.append(line)

              if current_title is not None:
                  groups.append((current_title, current_lines, False))

              lines = [
                  f"# {carrier_name}实时运行日志",
                  "",
                  f"> Run ID：`{status['run_id']}`  ",
                  f"> 更新时间：`{status['updated_at']}`  ",
                  f"> 原始日志：[打开 {carrier}.log](../../live-logs/private_logs/live/{carrier}.log)",
                  "",
              ]

              if preamble:
                  lines += [
                      "## 任务概览",
                      "",
                      "<pre>",
                      html.escape("\n".join(preamble)),
                      "</pre>",
                      "",
                  ]

              if not groups:
                  lines += ["_等待省份日志输出。_", ""]
              else:
                  for title, body, closed in groups:
                      running = not closed
                      lines.append("<details open>" if running else "<details>")
                      suffix = "（运行中）" if running else ""
                      lines.append(
                          f"<summary><strong>{html.escape(title)}{suffix}</strong></summary>"
                      )
                      lines += [
                          "",
                          "<pre>",
                          html.escape("\n".join(body)),
                          "</pre>",
                          "",
                          "</details>",
                          "",
                      ]

              return "\n".join(lines).rstrip() + "\n"

          def update_branch(repo_dir, branch, paths):
              run_git(repo_dir, ["add", *[str(p.relative_to(repo_dir)) for p in paths]])
              if run_git(repo_dir, ["diff", "--cached", "--quiet"]).returncode == 0:
                  return True
              if run_git(repo_dir, ["commit", "--amend", "--no-edit"]).returncode != 0:
                  return False
              return run_git(repo_dir, ["push", "--force", "origin", f"HEAD:{branch}"]).returncode == 0

          def sync_once():
              if not log_path.exists():
                  return True

              now = datetime.now(timezone.utc).isoformat()
              status = {
                  "run_id": os.environ.get("GITHUB_RUN_ID", ""),
                  "attempt": os.environ.get("GITHUB_RUN_ATTEMPT", "1"),
                  "carrier": carrier,
                  "updated_at": now,
                  "status": "running",
              }

              tmp = target_log.with_suffix(".log.tmp")
              shutil.copyfile(log_path, tmp)
              os.replace(tmp, target_log)
              target_status.write_text(
                  json.dumps(status, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              raw_ok = update_branch(
                  live_dir,
                  "live-logs",
                  [target_log, target_status],
              )

              text = log_path.read_text(encoding="utf-8", errors="replace")
              target_md.write_text(
                  render_markdown(text, status),
                  encoding="utf-8",
              )
              view_ok = update_branch(
                  view_dir,
                  "live-view",
                  [target_md],
              )
              return raw_ok and view_ok

          if once:
              raise SystemExit(0 if sync_once() else 1)

          while True:
              sync_once()
              time.sleep(30)
          PY

          python "$RUNNER_TEMP/private_live_sync.py"             "$FULL_LOG" "${GITHUB_WORKSPACE}/.private-live"             "${GITHUB_WORKSPACE}/.private-view" "$LOG_CARRIER"             >/dev/null 2>&1 &
          LIVE_SYNC_PID=$!

          set +e
          python -u .private-core/runner.py             --carrier "unicom"             --mode "${{ steps.mode.outputs.mode }}"             --event-name "${{ github.event_name }}"             >"$FULL_LOG" 2>&1
          RUN_CODE=$?
          set -e

          kill "$LIVE_SYNC_PID" >/dev/null 2>&1 || true
          wait "$LIVE_SYNC_PID" >/dev/null 2>&1 || true

          if ! python "$RUNNER_TEMP/private_live_sync.py"             "$FULL_LOG" "${GITHUB_WORKSPACE}/.private-live"             "${GITHUB_WORKSPACE}/.private-view" "$LOG_CARRIER" --once             >/dev/null 2>&1; then
            echo "::error::Private live-log synchronization failed."
            exit 1
          fi

          if [ "$RUN_CODE" -eq 0 ]; then
            echo "[+] Unicom updater completed on the public runner. Detailed log stayed private."
          else
            echo "::error::Unicom updater failed. Detailed log is available only in the private log branches."
            exit "$RUN_CODE"
          fi

      - name: Persist private state and final log
        if: always() && steps.mode.outputs.run == 'true'
        shell: bash
        env:
          FULL_LOG: ${{ env.IPTV_FULL_LOG }}
          LOG_CARRIER: "unicom"
        run: |
          set -euo pipefail
          LOG_PATH="$FULL_LOG"
          cd .private-core

          mkdir -p "private_logs/archive/$LOG_CARRIER"
          if [ -f "$LOG_PATH" ]; then
            cp "$LOG_PATH" "private_logs/archive/$LOG_CARRIER/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main >/dev/null 2>&1

          git add README.md private_workspace history/usable_endpoints.txt private_logs/archive
          if git diff --cached --quiet; then
            echo "[*] No private state changes."
            exit 0
          fi

          git commit -m "Update private IPTV state from public run ${GITHUB_RUN_ID}" >/dev/null

          if ! git rebase origin/main >/dev/null 2>&1; then
            git rebase --abort >/dev/null 2>&1 || true
            echo "::error::Private state changed concurrently; final state commit needs retry."
            exit 1
          fi

          git push origin HEAD:main >/dev/null 2>&1
          echo "[+] Playlist state and final log persisted privately."
