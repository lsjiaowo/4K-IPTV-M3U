name: Trigger Private Gist Migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-gist-migration.yml"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private Gist migration
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["PRIVATE_REPO_TOKEN"].strip()
          gist_token = os.environ["GIST_TOKEN"].strip()
          if not token or not gist_token:
              raise SystemExit("Required secret is missing")

          payload = {
              "event_type": "iptv_migrate_gist",
              "client_payload": {
                  "gist_token": gist_token
              },
          }
          body = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY_OWNER']}/4K-IPTV-Core/dispatches",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "4K-IPTV-Gist-Migration-Trigger",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              if response.status != 204:
                  raise SystemExit(f"Migration dispatch failed: HTTP {response.status}")
          print("[+] Private Gist migration dispatched.")
          PY
