name: Retire Old IPTV Gist

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-old-gist.yml"

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private core
        uses: actions/checkout@v5
        with:
          repository: lsjiaowo/4K-IPTV-Core
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-core
          fetch-depth: 1

      - name: Verify new Gist and delete retired Gist
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          private = Path(".private-core/private_workspace/.github")
          retired = json.loads((private / "retired-gist.json").read_text(encoding="utf-8"))
          publication = json.loads((private / "iptv-publication.json").read_text(encoding="utf-8"))

          old_id = str(retired["retired_gist_id"]).strip()
          active_id = str(retired["active_gist_id"]).strip()
          configured_id = str(publication["gist_id"]).strip()

          if active_id != configured_id:
              raise SystemExit("Active Gist ID does not match private publication config")

          headers = {
              "Authorization": f"Bearer {os.environ['GIST_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "4K-IPTV-Gist-Retirement",
          }

          # First verify the currently configured Gist is reachable.
          req = urllib.request.Request(
              f"https://api.github.com/gists/{active_id}",
              headers=headers,
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              if response.status != 200:
                  raise SystemExit(f"Active Gist verification failed: HTTP {response.status}")
              data = json.load(response)
          m3u_count = sum(1 for name in (data.get("files") or {}) if name.endswith(".m3u"))
          if m3u_count < 1:
              raise SystemExit("Active Gist contains no M3U files")

          # Then retire the old Gist. A prior successful deletion is also acceptable.
          req = urllib.request.Request(
              f"https://api.github.com/gists/{old_id}",
              method="DELETE",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  if response.status != 204:
                      raise SystemExit(f"Old Gist deletion failed: HTTP {response.status}")
              print("[+] Retired Gist deleted.")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("[+] Retired Gist was already absent.")
              else:
                  raise

          print(f"[+] Active Gist verified with {m3u_count} M3U files.")
          PY
